<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
</head>
<body>
<title>잠자리 날개 무늬 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 배치: 왼쪽에 조절판(묶음별 슬라이더), 오른쪽에 판재 미리보기. 좁은 화면에서는 미리보기가 위, 조절판이 아래 */
:root{--bg:#EEF0F2;--panel:#FFFFFF;--ink:#14171A;--mute:#5E6871;--line:#D3D8DD;--cut:#D6006E;--paper:#FFFFFF;--plate:#14171A;
  --sans:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181B;--panel:#1E2226;--ink:#E9ECEE;--mute:#9AA5AE;--line:#353B41;--cut:#FF5CA8;--paper:#F4F5F6;--plate:#14171A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181B;--panel:#1E2226;--ink:#E9ECEE;--mute:#9AA5AE;--line:#353B41;--cut:#FF5CA8;--paper:#F4F5F6;--plate:#14171A;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{margin:0;font-size:22px;font-weight:600;letter-spacing:-0.01em}
header p{margin:0;color:var(--mute);min-width:0}
.main{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:16px;align-items:start}
.controls{display:flex;flex-direction:column;gap:10px;min-width:0}
.view{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.view{position:static;order:-1}}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,.chip{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer}
button:hover,.chip:hover{border-color:var(--ink)}
button:focus-visible,input:focus-visible,summary:focus-visible,textarea:focus-visible{outline:2px solid var(--cut);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:500}
button[aria-pressed="true"]{border-color:var(--cut);color:var(--cut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 10px;font-size:13px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:8px;display:flex;justify-content:center;align-items:center;padding:14px;min-height:320px}
.stage svg{display:block;width:auto;height:min(72vh,860px);max-width:100%}
.stats{font-family:var(--mono);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;gap:4px 16px}
.msg{font-size:13px;color:var(--mute);min-height:1.5em}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px}
summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style-position:inside}
.rows{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:2px 12px 14px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:baseline}
.row label{min-width:0}
.row output{font-family:var(--mono);font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1 / -1;width:100%;margin:0;accent-color:var(--cut)}
.row small{grid-column:1 / -1;color:var(--mute);font-size:12px}
.check{display:flex;gap:8px;align-items:center}
textarea{font-family:var(--mono);font-size:12px;width:100%;box-sizing:border-box;min-height:64px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:8px}
.strip{margin-top:14px}.striphead{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:6px}.striphead small{font-weight:400;color:var(--mute);margin-left:6px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;min-height:44px}.thumbs:empty::after{content:'아직 없습니다';color:var(--mute);font-size:12px;align-self:center}
.thumb{position:relative;flex:0 0 auto;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;line-height:0}
.thumb img{height:92px;display:block}.thumb[aria-current="true"]{outline:2px solid var(--cut);outline-offset:1px}
.thumb .del{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:12px;line-height:18px;padding:0;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
.thumbs.big .thumb img{height:170px}
.row{display:flex;flex-direction:column;gap:4px}.row.na,.row.nf{display:none}.rowtop{display:flex;align-items:center;gap:6px}.rowtop label{flex:1;min-width:0}
.num{width:74px;font-family:var(--mono);font-size:12px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);text-align:right}
.unit{font-size:11px;color:var(--mute);min-width:20px}.mini{padding:2px 7px;font-size:12px;line-height:1.3}
.find{width:100%;box-sizing:border-box;margin:8px 0;padding:7px 10px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}
.lock{font-size:13px}.sixopt{margin:2px 0 6px;font-size:13px;flex-wrap:wrap}.sixopt input[type=range]{width:120px;vertical-align:middle}
</style>
<div class="wrap">
<header>
<h1>잠자리 날개 무늬 생성기</h1>
<p>무작위나 「여섯 가지 보기」로 모양을 넘겨 보다가 마음에 들면 ★ 보관하세요. 지나온 모양은 아래 줄에서 눌러 돌아갑니다. 검은 부분이 판, 흰 부분이 뚫리는 칸입니다.</p>
</header>
<div class="main">
<div class="controls">
<div class="bar"><button type="button" class="primary" id="btnRandom" title="단축키 R">무작위</button><label class="check lock"><input type="checkbox" id="lockOutline">외곽 고정</label><label class="check lock"><input type="checkbox" id="lockPattern">무늬 고정</label><button type="button" id="btnSeed" hidden>무늬만 다시</button><button type="button" id="btnOutline" hidden>외곽만 다시</button></div>
<div class="bar"><button type="button" id="btnUndo" title="단축키 Ctrl/⌘+Z">◀ 이전</button><button type="button" id="btnRedo" title="단축키 Shift+Ctrl/⌘+Z">다음 ▶</button><button type="button" id="btnFav">★ 보관</button><button type="button" id="btnReset">처음 값으로</button></div>
<div class="chips" id="presets" aria-label="미리 만든 모양"></div>
<input type="search" id="find" class="find" placeholder="조절 항목 찾기 (예: 굵기, 둥글기)" aria-label="조절 항목 찾기">
<div id="groups"></div>
<details><summary>설정 보관</summary><div class="rows">
<div class="bar"><button type="button" id="btnCopy">지금 설정 복사</button><button type="button" id="btnApply">아래 설정 넣기</button></div>
<textarea id="cfg" aria-label="설정 글" placeholder="복사해 둔 설정을 여기에 붙여 넣고 '아래 설정 넣기'를 누르세요"></textarea>
</div></details>
</div>
<div class="view">
<div class="bar">
<button type="button" class="primary" id="btnPlate">SVG 저장 · 판</button>
<button type="button" id="btnLines">SVG 저장 · 자름선</button>
<button type="button" id="btnView" aria-pressed="false">자름선으로 보기</button>
<button type="button" id="btnPng">PNG 저장</button>
<button type="button" id="btnSix">여섯 가지 보기</button>
<button type="button" id="btnShare">주소로 공유</button>
<button type="button" id="btnZoom" aria-pressed="false">크게 보기</button>
</div>
<div class="strip" id="varsBox" hidden><div class="striphead">여섯 가지 <small>마음에 드는 것을 누르면 그 모양이 되고, 거기서 다시 여섯 가지가 나옵니다</small></div><div class="bar sixopt"><label class="check"><input type="radio" name="sixMode" value="new" checked>서로 다른 모양</label><label class="check"><input type="radio" name="sixMode" value="near">지금과 비슷하게</label><label class="check">조금 <input type="range" id="sixAmt" min="0.1" max="1" step="0.05" value="0.4" aria-label="바뀌는 정도"> 많이</label></div>
<div class="thumbs big" id="vars"></div></div>
<div class="stage" id="stage"></div>
<div class="stats" id="stats"></div>
<div class="strip"><div class="striphead">지나온 모양 <small>누르면 그 모양으로 돌아갑니다</small></div><div class="thumbs" id="hist"></div></div>
<div class="strip"><div class="striphead">보관함 <small>★ 보관으로 담아 둔 모양. 창을 닫아도 남습니다</small></div><div class="thumbs" id="favs"></div></div>
<div class="msg" id="msg" role="status"></div>
</div>
</div>
</div>

  if(name==='외곽 모양'){const c=document.createElement('label');c.className='check';const i=document.createElement('input');i.type='checkbox';i.id='p-mirror';i.addEventListener('change',()=>{P.mirror=i.checked;draw();});c.append(i,document.createTextNode('좌우 뒤집기 (반대쪽 날개)'));box.appendChild(c);}

  {const gb=document.createElement('button');gb.type='button';gb.className='mini';gb.textContent='이 묶음 처음 값으로';gb.addEventListener('click',()=>{rows.forEach(q=>{P[q[0]]=D[q[0]];});sync();draw();msg('「'+name+'」 묶음을 처음 값으로 돌렸습니다.');});box.appendChild(gb);}
  d.appendChild(box);groups.appendChild(d);});
$('find').addEventListener('input',()=>{const q=$('find').value.trim().toLowerCase();document.querySelectorAll('#groups details').forEach(d=>{let any=0;d.querySelectorAll('.row').forEach(r=>{const hit=!q||r.dataset.find.indexOf(q)>=0;r.classList.toggle('nf',!hit);if(hit)any=1;});d.hidden=!any;if(q&&any)d.open=true;});});
PRESETS.forEach(([name,o])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=name;b.addEventListener('click',()=>{P=Object.assign({},D,{lengthMm:P.lengthMm,mirror:P.mirror},o);sync();draw();msg('"'+name+'" 모양을 불러왔습니다.');});$('presets').appendChild(b);});
function fmt(k,unit){const v=P[k];if(k==='lengthMm')return Math.round(v)+' mm';if(MMKEYS[k])return (v*P.lengthMm/1000).toFixed(1)+' mm';if(unit==='줄'||k==='depth'||k==='seed'||k==='shape'||k==='shape2')return String(Math.round(v))+(unit?' '+unit:'');if(unit==='배')return v.toFixed(2)+' 배';if(unit==='°')return Math.round(v)+'°';return v.toFixed(2);}
function sync(){if(dry)return;document.querySelectorAll('input[type=range]').forEach(i=>{i.value=P[i.dataset.k];});$('p-mirror').checked=!!P.mirror;$('p-flow').value=P.flow||'B';}
let hist=[],hpos=-1,favs=[];
try{favs=JSON.parse(localStorage.getItem('wing-favs-v1')||'[]')||[];}catch(e){}
function thumb(r){try{const c=document.createElement('canvas'),h=184,w=Math.max(40,Math.round(h*r.viewW/r.viewH));c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.scale(w/r.viewW,h/r.viewH);x.fillStyle='#14171A';x.fill(new Path2D(r.oPath+' '+r.cPaths.join(' ')),'evenodd');return c.toDataURL('image/png');}catch(e){return '';}}
function strip(box,list,cur,onPick,onDel){box.replaceChildren(...list.map((it,i)=>{const b=document.createElement('button');b.type='button';b.className='thumb';b.setAttribute('aria-label',(i+1)+'번째 모양으로');if(i===cur)b.setAttribute('aria-current','true');
    const im=document.createElement('img');im.alt='';im.src=it.img;b.appendChild(im);b.addEventListener('click',()=>onPick(i));
    if(onDel){const d=document.createElement('span');d.className='del';d.textContent='×';d.setAttribute('role','button');d.setAttribute('aria-label','보관함에서 빼기');d.addEventListener('click',e=>{e.stopPropagation();onDel(i);});b.appendChild(d);}return b;}));}
function showHist(){strip($('hist'),hist,hpos,go);$('btnUndo').disabled=hpos<=0;$('btnRedo').disabled=hpos>=hist.length-1;const c=$('hist').querySelector('[aria-current]');if(c&&c.scrollIntoView)c.scrollIntoView({block:'nearest',inline:'nearest'});}

function commit(){const s=JSON.stringify(P);if(hpos>=0&&hist[hpos].s===s)return;hist=hist.slice(0,hpos+1);hist.push({s,img:last?thumb(last):''});if(hist.length>30)hist.shift();hpos=hist.length-1;showHist();}
function go(i){if(i<0||i>=hist.length||i===hpos)return;hpos=i;P=Object.assign({},D,JSON.parse(hist[i].s));sync();draw(false,true);showHist();msg('지나온 모양 '+(i+1)+'번으로 돌아왔습니다.');}
let vars=[],zoom=false;
const OUTK=['leadBulge','shape','shapeW','shape2','shapeMix','width','peak','taper','tip','tipCenter','leadStart','root','belly','bottomRound','flex','bend','lean','tabW','tabH','tabAlign','rootSolid','baseRound','frontW'],FORM=new Set(['width','peak','taper','tip','tipCenter','leadStart','leadBulge','root','belly','bottomRound','flex']);
let before=null,randomizing=false;
function lockMerge(c,b){const o=Object.assign({},c);if($('lockOutline').checked)OUTK.forEach(k=>{o[k]=b[k];});if($('lockPattern').checked)Object.keys(b).forEach(k=>{if(OUTK.indexOf(k)<0)o[k]=b[k];});o.lengthMm=b.lengthMm;o.mirror=b.mirror;return o;}
document.addEventListener('click',e=>{if(!dry&&e.target&&e.target.closest&&e.target.closest('#btnRandom')){before=P;randomizing=true;}},true);
let sixUsed=null;
function pickShape(){const SH=WingGen.SHAPES||[],G=WingGen.SHAPE_GROUPS||[];if(!SH.length)return -1;if(G.length!==SH.length)return Math.floor(Math.random()*SH.length);
  let gs=Array.from(new Set(G));if(sixUsed){const left=gs.filter(g=>!sixUsed.has(g));if(left.length)gs=left;}const g=gs[Math.floor(Math.random()*gs.length)];if(sixUsed)sixUsed.add(g);
  const m=[];G.forEach((x,i)=>{if(x===g)m.push(i);});return m[Math.floor(Math.random()*m.length)];}   // 닮은 꼴 묶음을 먼저 고른다 → 드문 꼴도 흔한 꼴만큼 나온다
function mutate(b,amt){const o=Object.assign({},b),skip={lengthMm:1,shape:1,seed:1,nFront:1,tabW:1,tabH:1,tabAlign:1,rootSolid:1,baseRound:1,minCell:1,maxCell:1,slit:1,rim:1,frontMul:1};
  Object.keys(RANGE).forEach(k=>{if(skip[k]||(b.shape>=0&&FORM.has(k)))return;const g=RANGE[k],v=b[k]+(Math.random()-0.5)*0.5*amt*(g[1]-g[0]);o[k]=Math.min(g[1],Math.max(g[0],v));});
  o.seed=Math.round(rand(1,999));const SH=WingGen.SHAPES||[];if(SH.length&&b.shape>=0&&Math.random()<0.45*amt){const i=pickShape();o.shape=i;o.tabH=SH[i][3];}return o;}
function draw(fast,noCommit){if(dry)return;if(randomizing){randomizing=false;if(before){P=lockMerge(P,before);sync();}}
  let r;try{r=WingGen.generateWing(fast?Object.assign({},P,{res:1.3}):P);}catch(e){msg('이 값 조합으로는 그릴 수 없습니다. 값을 조금 바꿔 보세요.');return;}
  last=r;document.querySelectorAll('input.num').forEach(nb=>{if(document.activeElement===nb)return;const k=nb.dataset.k,v=MMKEYS[k]?P[k]*P.lengthMm/1000:P[k];nb.value=MMKEYS[k]?v.toFixed(1):String(+(+v).toFixed(3));});
  if(!fast){const lib=P.shape>=0;document.querySelectorAll('#groups .row').forEach(r=>{const k=r.dataset.k;r.classList.toggle('na',lib?FORM.has(k):(k==='shapeW'||k==='shape2'||k==='shapeMix'));});}   // 지금 쓰이지 않는 막대는 감춘다
  const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 '+r.viewW.toFixed(1)+' '+r.viewH.toFixed(1));svg.setAttribute('role','img');svg.setAttribute('aria-label','날개 무늬 미리보기');
  if(lines){const o=document.createElementNS(ns,'path');o.setAttribute('d',r.oPath);o.setAttribute('fill','none');o.setAttribute('stroke','#D6006E');o.setAttribute('stroke-width','2');svg.appendChild(o);
    const c=document.createElementNS(ns,'path');c.setAttribute('d',r.cPaths.join(' '));c.setAttribute('fill','none');c.setAttribute('stroke','#14171A');c.setAttribute('stroke-width','1.4');svg.appendChild(c);}
  else{const p=document.createElementNS(ns,'path');p.setAttribute('d',r.oPath+' '+r.cPaths.join(' '));p.setAttribute('fill','#14171A');p.setAttribute('fill-rule','evenodd');svg.appendChild(p);}
  $('stage').replaceChildren(svg);
  if(zoom){svg.style.height='190vh';svg.style.maxHeight='none';svg.style.width='auto';$('stage').style.overflow='auto';}else $('stage').style.overflow='';
  const thin=P.sec*(1-P.thickVar)*r.mm;
  $('stats').replaceChildren(...[['칸',r.cells+'개'],['전체 크기',(r.viewW*r.mm).toFixed(0)+' × '+(r.viewH*r.mm).toFixed(0)+' mm (여백 포함)'],['가장 가는 살',thin.toFixed(1)+' mm']].map(([a,b])=>{const s=document.createElement('span');s.textContent=a+' '+b;return s;}));
  if(!fast)try{localStorage.setItem('wing-params-v16',JSON.stringify(P));}catch(e){}
  if(!fast&&!noCommit)commit();
}
function rand(a,b){return a+Math.random()*(b-a);}
$('btnRandom').addEventListener('click',()=>{const keep={lengthMm:P.lengthMm,mirror:P.mirror},SH=WingGen.SHAPES||[];
  if(SH.length&&Math.random()<0.8){const i=pickShape(),wm=Math.max.apply(null,SH[i][1])/1000;                      // 보내 주신 그림의 외곽 가운데 하나
    P=Object.assign({},D,G,keep,{shape:i,shapeW:rand(0.78,1.3),shape2:pickShape(),shapeMix:Math.random()<0.45?rand(0.2,0.5):0,bend:rand(-0.09,0.09),lean:rand(-0.1,0.16),flex:0,tabW:1,tabH:SH[i][3],bottomRound:1,rim:rand(9.5,11.5),sec:rand(6.6,7.6),main:7.8,cell:rand(18,21),aspect:rand(1.1,1.35),
      frontW:Math.min(0.2,Math.max(0.07,0.036/wm)),flow:Math.random()<0.3?'A':'B',sweep:rand(0.85,1.25),stagger:rand(0,0.5),lenRand:rand(0.15,0.35),slitPos:rand(0.5,0.68),seed:Math.round(rand(1,999))});
    sync();draw();msg('보내 주신 그림의 외곽 '+(i+1)+'번에 새 무늬를 넣었습니다.');return;}
  P=Object.assign({},D,G,keep,{rim:P.rim,frontMul:P.frontMul,main:P.main,sec:P.sec,flow:Math.random()<0.3?'A':'B',width:rand(0.16,0.48),peak:rand(0.22,0.75),root:rand(0.13,0.3),belly:rand(0.8,2.8),taper:rand(0,0.7),tip:rand(0.9,1.5),tipCenter:rand(0.15,0.6),leadStart:rand(0.5,0.85),bend:rand(-0.06,0.03),lean:rand(-0.08,0.3),flex:rand(0,0.12),
    sweep:rand(0.7,1.3),stagger:rand(0,0.6),cell:Math.max(P.sec*1.9+6,rand(14,22)),aspect:rand(1.15,1.8),lenRand:rand(0.1,0.45),seed:Math.round(rand(1,999))});P.frontW=Math.min(0.18,0.034/P.width);
  sync();draw();msg('막대 값으로 새 외곽을 만들었습니다.');});
$('btnSix').addEventListener('click',()=>{$('varsBox').hidden=false;vars=[];strip($('vars'),vars,-1,()=>{});msg('여섯 가지를 만드는 중입니다…');let i=0;sixUsed=new Set();const base=P,near=document.querySelector('input[name=sixMode]:checked').value==='near',amt=parseFloat($('sixAmt').value);
  const pick=k=>{P=Object.assign({},D,JSON.parse(vars[k].s));sync();draw();msg('고른 모양으로 바꿨습니다. 「◀ 이전」으로 돌아갈 수 있습니다.');if(near)setTimeout(()=>$('btnSix').click(),60);};
  const step=()=>{if(i>=6||P!==base&&i>0&&false){msg('여섯 가지가 준비됐습니다. 마음에 드는 것을 누르세요.');return;}let cand;
    if(near)cand=mutate(base,amt);else{dry=true;$('btnRandom').click();cand=P;P=base;dry=false;}cand=lockMerge(cand,base);
    let r=null;try{r=WingGen.generateWing(Object.assign({},cand,{res:1.3}));}catch(e){}if(r)vars.push({s:JSON.stringify(cand),img:thumb(r)});strip($('vars'),vars,-1,pick);i++;setTimeout(step,30);};step();});
$('btnShare').addEventListener('click',async()=>{const d={};Object.keys(P).forEach(k=>{if(P[k]!==D[k])d[k]=typeof P[k]==='number'?+P[k].toFixed(4):P[k];});const u=location.origin+location.pathname+'#p='+encodeURIComponent(JSON.stringify(d));

$('btnPng').addEventListener('click',()=>{if(!last)return;const H=3000,Wp=Math.round(H*last.viewW/last.viewH),c=document.createElement('canvas');c.width=Wp;c.height=H;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,Wp,H);x.scale(Wp/last.viewW,H/last.viewH);x.fillStyle='#000';x.fill(new Path2D(last.oPath+' '+last.cPaths.join(' ')),'evenodd');

    try{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();msg(filename+' 내려받기를 시작했습니다.');}catch(e){msg('이 화면에서는 저장할 수 없습니다.');}},'image/png');});
$('btnOutline').addEventListener('click',()=>{const SH=WingGen.SHAPES||[];if(!SH.length)return;const i=Math.floor(Math.random()*SH.length),wm=Math.max.apply(null,SH[i][1])/1000;
