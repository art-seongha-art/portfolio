<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>날개 모빌 — 웹캠으로 만지는 모빌</title>

<style>
  :root { color-scheme: dark; }
  html,body { margin:0; height:100%; background:#0a0b0d; overflow:hidden;
              font:13px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; color:#cfd3da; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  #panel { position:fixed; top:12px; right:12px; width:250px; max-height:calc(100vh - 24px);
           overflow-y:scroll; padding:12px 6px 14px 13px; border-radius:11px;
           scrollbar-width:thin; scrollbar-color:#5a6474 rgba(255,255,255,.05);
           background:rgba(14,16,20,.82); backdrop-filter:blur(14px);
           border:1px solid rgba(255,255,255,.09); z-index:10; transition:opacity .2s; }
  #panel.hidden { opacity:0; pointer-events:none; }
  #panel::-webkit-scrollbar { width:9px; }
  #panel::-webkit-scrollbar-track { background:rgba(255,255,255,.05); border-radius:5px; margin:6px 0; }
  #panel::-webkit-scrollbar-thumb { background:#5a6474; border-radius:5px; border:2px solid transparent;
                                    background-clip:content-box; }
  #panel::-webkit-scrollbar-thumb:hover { background:#7b8697; background-clip:content-box; }
  #panel h2 { margin:0 0 9px; font-size:12px; font-weight:600; letter-spacing:.02em; color:#eef1f5; }
  #panel h3 { margin:9px 0 4px; font-size:10.5px; font-weight:600; letter-spacing:.05em;
              color:#8a93a2; border-top:1px solid rgba(255,255,255,.07); padding-top:8px; }
  #panel h3:first-of-type { border-top:0; }
  #panel h3.fold { cursor:pointer; user-select:none; }
  #panel h3.fold:hover { color:#cfd6e0; }
  #panel .body[hidden] { display:none; }
  .row { display:flex; align-items:center; gap:7px; margin:5px 0; }
  .row label { flex:1 1 auto; font-size:11.5px; color:#a9b0bc; }
  .row .val { flex:0 0 42px; text-align:right; font-variant-numeric:tabular-nums; font-size:11px; color:#7f8794; }
  .row input[type=range] { flex:0 0 96px; height:3px; -webkit-appearance:none; background:#2b3038; border-radius:2px; }
  .row input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:11px; height:11px;
       border-radius:50%; background:#c8ced8; cursor:pointer; }
  .row input[type=checkbox] { accent-color:#7d8896; }
  .row[hidden] { display:none; }
  .row select.pick { flex:0 0 104px; background:#22262e; color:#cfd3da; font-size:11px;
        border:1px solid rgba(255,255,255,.1); border-radius:5px; padding:2px 4px; }
  #presets { margin:0 0 10px; }
  #presets .p { display:flex; align-items:center; gap:5px; margin:3px 0; }
  #presets .p .nm { flex:1; font-size:11.5px; color:#5f6672; }
  #presets .p.has .nm { color:#cfd3da; }
  #presets .p button { padding:3px 7px; border-radius:6px; font-size:10.5px; cursor:pointer;
        background:#232830; color:#aeb6c2; border:1px solid rgba(255,255,255,.1); }
  #presets .p button:hover:not(:disabled) { background:#2b313a; color:#fff; }
  #presets .p button:disabled { opacity:.32; cursor:default; }
  #presets .p .sv { color:#8fd0a0; }
  #presets .st { font-size:10.5px; color:#6b7381; margin:5px 0 0; min-height:14px; }
  .extent { margin:2px 0 7px; font-size:10.5px; line-height:1.5; color:#6b7381;
            padding:5px 7px; border-radius:6px; background:rgba(255,255,255,.035); }
  #cammsg { position:fixed; left:12px; right:12px; bottom:56px; z-index:11; font-size:11.5px;
            line-height:1.5; color:#e6c98a; padding:7px 10px; border-radius:8px;
            background:rgba(20,17,12,.82); backdrop-filter:blur(10px);
            border:1px solid rgba(230,201,138,.22); transition:opacity .2s; }
  #cammsg.hidden { opacity:0; pointer-events:none; }
  #hint { position:fixed; left:14px; bottom:12px; z-index:10; font-size:11.5px; color:#6d747f;
          line-height:1.7; transition:opacity .2s; }
  #hint.hidden { opacity:0; }
  #hint b { color:#98a0ad; font-weight:600; }
  /* 프레임은 폰에서도 읽혀야 한다. #stat 은 폭이 눌려 잘리므로 따로 크게 뽑는다 */
  #fps { position:fixed; left:14px; top:50px; z-index:12; font-size:23px; font-weight:700;
         line-height:1.1; color:#cfd3da; font-variant-numeric:tabular-nums;
         text-shadow:0 2px 10px rgba(0,0,0,.85); transition:opacity .2s; pointer-events:none; }
  #fps.hidden { opacity:0; }
  #fps small { display:block; font-size:10.5px; font-weight:500; color:#7d848f; letter-spacing:.02em; }
  #stat { position:fixed; left:14px; top:96px; z-index:10; max-width:calc(100% - 300px); font-size:11px; color:#5d646e;
          font-variant-numeric:tabular-nums; transition:opacity .2s; }
  #stat.hidden { opacity:0; }
  #boot { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
          flex-direction:column; gap:14px; z-index:20; background:#0a0b0d; transition:opacity .5s; }
  #boot.gone { opacity:0; pointer-events:none; }
  #boot p { margin:0; color:#79808c; font-size:12.5px; }
  #boot .bar { width:190px; height:2px; background:#20242b; border-radius:1px; overflow:hidden; }
  #boot .bar i { display:block; height:100%; width:0; background:#8d95a3; transition:width .3s; }
  #cam { position:fixed; right:12px; bottom:12px; width:168px; border-radius:8px; z-index:10;
         transform:scaleX(-1); opacity:.34; border:1px solid rgba(255,255,255,.08); transition:opacity .2s; }
  #cam.hidden { opacity:0; }
  /* 카메라가 사람을 어떻게 보고 있나. 벽 앞에서 겨냥할 때만 켠다 (0 키) */
  #silh { position:fixed; inset:0; width:100%; height:100%; z-index:9; pointer-events:none;
          opacity:.4; image-rendering:pixelated; transition:opacity .2s; }
  #silh.hidden { opacity:0; }
  button.act { width:100%; margin-top:9px; padding:7px; border-radius:7px; cursor:pointer;
        background:#232830; color:#cfd3da; border:1px solid rgba(255,255,255,.1); font-size:11.5px; }
  button.act:hover { background:#2b313a; }
  /* 허브가 오른쪽 아래에 붙이는 저장·불러오기 바. 설정을 접으면 같이 사라져야 한다 —
     전시에서는 작품만 남아야 하므로 우리 설정 상태에 묶는다 */
  html:not(.wm-open) .hub-art-bar { display:none !important; }
  #tools { position:fixed; left:12px; top:12px; z-index:12; display:flex; gap:7px; transition:opacity .2s; }
  #tools.hidden { opacity:0; pointer-events:none; }
  #tools button { width:32px; height:32px; display:flex; align-items:center; justify-content:center;
        border-radius:9px; cursor:pointer; color:#aeb6c2;
        background:rgba(14,16,20,.62); backdrop-filter:blur(10px);
        border:1px solid rgba(255,255,255,.10); transition:.15s; }
  #tools button:hover { color:#fff; background:rgba(30,34,42,.85); border-color:rgba(255,255,255,.2); }
  #tools button.on { color:#fff; background:rgba(52,60,74,.9); border-color:rgba(255,255,255,.28); }
</style>
</head>

  <button id="btnGear" title="설정 (H)">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7"

  </button>
  <button id="btnFull" title="전체화면 (F)">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9"

  </button>
</div>

<div id="fps" class="hidden"></div>
<div id="stat" class="hidden"></div>

<div id="panel" class="hidden">
  <h2>날개 모빌</h2>
  <div id="presets"></div>
  <div id="controls"></div>
  <button class="act" id="btnSeed">배치 다시 뽑기</button>
  <button class="act" id="btnCam">웹캠 켜기</button>
  <button class="act" id="btnShake">한번 흔들기 (스페이스)</button>
</div>

<div id="cammsg" class="hidden"></div>

<div id="hint">
  <b>드래그</b> 모빌 치기 · <b>클릭+끌기</b> 잡아서 옮기기 · <b>휠</b> 다가가기<br>
  <b>H</b> 설정 켜고/끄기 · <b>1</b>~<b>5</b> 전시 프리셋 · <b>F</b> 전체화면 · <b>C</b> 웹캠 · <b>R</b> 재우기 · <b>M</b> 음소거<br>
  <b>6</b> 손 · <b>7</b> 몸이 옆으로 밀기 · <b>8</b> 몸이 가는 쪽으로 쓸기 · <b>9</b> 손+몸 · <b>0</b> 실루엣 보기
</div>

<div id="boot"><p id="bootMsg">준비하는 중…</p><div class="bar"><i id="bootBar"></i></div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { HDRLoader }   from 'three/addons/loaders/HDRLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }     from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass }      from 'three/addons/postprocessing/BokehPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }     from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass }     from 'three/addons/postprocessing/ShaderPass.js';

// ────────────────────────────────────────────────────────────────
// 조절값 — 패널에 그대로 뜬다
// ────────────────────────────────────────────────────────────────
// 휴대폰 판정. 미디어파이프의 GPU 델리게이트는 createFromOptions 가 검사하지 않고
// **첫 프레임을 밀어 넣을 때** 비로소 GL 을 만진다 — 그래서 못 쓰는 기기에서는 만들기는 성공하고
// 인식만 조용히 실패한다. 폰은 기다리지 말고 처음부터 CPU 로 간다
const 손닿는기기 = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 1;

const P = {
  // ── 배치. 축을 이름에 박아둔다. Z는 "카메라에서 멀어지는 앞뒤 축"이다
  // 갈래마다 **개수를 직접** 넣는다. 전체는 합으로 나온다
  '공 개수':     { v: 45,   min: 0,   max: 1200, step: 5 },
  '나비 개수':   { v: 45,   min: 0,   max: 1200, step: 5 },
  '잠자리 개수': { v: 30,   min: 0,   max: 1200, step: 5 },
  'LED 개수':    { v: 30,   min: 0,   max: 1200, step: 5 },
  '배치 씨앗':   { v: 1,    min: 1,   max: 9999, step: 1 },     // 같은 씨앗이면 같은 배열
  '배치 모양':   { v: '네모', 목록: ['네모','화면꼴','동그라미','타원','고리','하트','나선','꽈배기'] },
  '고리 안쪽':   { v: 0.55, min: 0,   max: .95,  step: .01 },   // 「고리」일 때 가운데 빈 비율
  '감김 수':     { v: 3.0,  min: .5,  max: 12,   step: .5 },    // 「나선·꽈배기」가 몇 바퀴 도나
  '선 두께 m':   { v: 0.25, min: 0,   max: 3,    step: .05 },   // 「나선·꽈배기」 줄기의 굵기
  '위 폭 배':    { v: 1.0,  min: 0,   max: 2,    step: .05 },   // 「꽈배기」 맨 위의 굵기 배수
  '아래 폭 배':  { v: 0.3,  min: 0,   max: 2,    step: .05 },   // 「꽈배기」 맨 아래의 굵기 배수
  '보는 거리 m': { v: 9,    min: 2,   max: 40,   step: .5 },   // 카메라와 작품 사이. 배치는 그대로고 멀리·가까이만 간다
  '유닛 크기 배': { v: 1.65, min: .2,  max: 4,    step: .05 },  // 제자리에서 유닛 자체가 커지고 작아진다
  '카메라 높이 m': { v: 0,  min: -10, max: 10,   step: .1 },   // 올리면 위에서, 내리면 아래에서 본다
  // 아래 셋은 **미터**다. ± 값이라 「가로 3.8」이면 x 가 −3.8 ~ +3.8 m 에 깔린다
  '가로 퍼짐 m': { v: 3.8,  min: .2,  max: 30,   step: .1 },
  '높이 퍼짐 m': { v: 2.6,  min: .2,  max: 20,   step: .1 },
  '깊이 퍼짐 m': { v: 3.0,  min: 0,   max: 30,   step: .1 },
  '천장 여유 m': { v: 0.6,  min: 0,   max: 10,   step: .1 },   // 공 맨 위에서 앵커까지 더 올라가는 높이
  '크기 편차':   { v: 0.55, min: 0,   max: 1,    step: .01 },  // 유닛마다 크기가 얼마나 다른가

  실보이기:     { v: true },
  실장력:       { v: 10,   min: 1,   max: 24,   step: 1 },    // 구속 반복 — 적으면 끝만 꺾인다
  '실 진하기':   { v: 0.04, min: 0,   max: 1,    step: .01 },

  중력:        { v: 9.8,  min: 0,   max: 30,   step: .1 },
  공기저항:     { v: 0.32, min: 0,   max: 3,    step: .01 },
  비틀림:       { v: 0.9,  min: 0,   max: 6,    step: .05 },
  바람:        { v: 0.12, min: 0,   max: 1,    step: .005 },

  부딪히기:     { v: true },
  실도부딪힘:   { v: true },                                   // 공이 이웃의 실을 헤치고 지나간다
  반발:        { v: 0.25, min: 0,   max: .95,  step: .01 },
  회전전달:     { v: 0.6,  min: 0,   max: 4,    step: .05 },

  장신구:      { v: true },
  손세기:      { v: 1.0,  min: 0,   max: 6,    step: .05 },
  치기문턱:     { v: 0.9,  min: 0,   max: 4,    step: .05 },   // m/s. 이보다 느리면 밀리기만 한다
  잡기범위:     { v: 0.28, min: .05, max: 1.2,  step: .01 },

  // ── 빛. LED 는 공간을 흐르는 색의 장에서 제 색을 읽는다
  LED팔레트:    { v: '심해', 목록: ['심해','오로라','성운','노을','무지개'] },
  LED속도:      { v: 1.0,  min: 0,   max: 4,    step: .05 },
  LED얼룩:      { v: 1.0,  min: 0,   max: 3,    step: .05 },   // 물결에 섞이는 불규칙함
  LED결:        { v: 0.35, min: 0,   max: 2,    step: .01 },   // 공간에 따른 색 변화의 촘촘함
  숨쉬기:       { v: 0.45, min: 0,   max: 1,    step: .01 },
  번쩍세기:     { v: 1.6,  min: 0,   max: 6,    step: .1 },    // 부딪히면 밝아진다
  블룸:        { v: true },
  블룸세기:     { v: 0.028, min: 0,  max: .05,  step: .001 },
  블룸문턱:     { v: 0.64, min: 0,   max: 3,    step: .02 },   // LED 겹에만 걸리므로 낮아도 된다
  블룸번짐:     { v: 1.05, min: 0,   max: 1.5,  step: .05 },

  // ── 스텐볼 캔디 도장. 금속의 기본색은 반사 색조라 색을 주면 그대로 색거울이 된다
  스텐색칠:     { v: '높이', 목록: ['없음','무작위','높이','깊이','층','물결'] },
  스텐팔레트:   { v: '사탕', 목록: ['사탕','보석','파스텔','금속','바다'] },
  스텐진하기:   { v: 0.75, min: 0,   max: 1,    step: .01 },
  '색 띠 개수': { v: 5,    min: 2,   max: 12,   step: 1 },   // 「층」 방식일 때만 쓰인다

  노출:        { v: 1.15, min: .2,  max: 3,    step: .01 },
  '위에서 보기': { v: false },                                 // 배치를 위에서 내려다보는 작은 창
  '위뷰 크기':   { v: 0.16, min: .10, max: .40, step: .01 },
  아웃포커싱:   { v: true },                                   // 초점은 가장 가까운 유닛에 맞는다
  흐림시작:     { v: 4.0,  min: .5,  max: 12,   step: .1 },    // 초점이 이 거리보다 가까워야 흐려진다
  흐림세기:     { v: 1.0,  min: .1,  max: 3,    step: .05 },
  손뼈보이기:   { v: true },
  손깊이자동:   { v: true },                                   // 손을 겨냥한 유닛의 깊이로 데려간다
  손겨냥반경:   { v: 0.09, min: .02, max: .3,   step: .005 },
  손인식CPU:    { v: 손닿는기기 },                              // 폰은 처음부터 CPU. GPU 는 폰에서 조용히 빈 결과만 준다
  // 빔과 카메라가 같은 자리에서 벽을 볼 때, 그 사이로 사람이 들어오면 무슨 일이 나는가.
  // **발(門簾)을 젖히고 들어가듯** 실이 갈라지고 소리가 난다. 손 모드와 배타적이다 —
  // 몸만 볼 때는 손 인식을 아예 끄므로 무거워지지 않는다
  몸모드:      { v: '손', 목록: ['손','몸 · 옆으로','몸 · 가는 쪽으로','손+몸'] },
  몸세기:      { v: 1.0,  min: .1, max: 4,  step: .05 },       // 얼마나 세게 젖혀지나
  몸좌우뒤집기: { v: true },                                    // 카메라와 벽의 좌우가 맞는지. 방에서 맞춰 본다

// 부품을 **노드 이름**으로 거둔다.
// 주의: GLTFLoader 는 프리미티브가 하나면 Mesh 를 노드 이름으로 만들지만,
// 재질이 갈려 프리미티브가 둘 이상이면 **Group** 을 만들고 자식 Mesh 이름은
// 노드가 아니라 *메시* 이름(led1_lod0.001 → 점이 지워져 led1_lod0001)에서 짓는다.
// 이름 짐작으로 찾으면 led 유닛이 통째로 사라진다 — 실제로 그렇게 됐었다.
// 그래서 부모를 타고 올라가 노드 이름을 쓴다.
const 부품 = {};                             // 노드이름 -> [{형상, 재질}, …]
const 재질전부 = new Set();
gltf.scene.updateMatrixWorld(true);
gltf.scene.traverse(o => {
  if (!o.isMesh) return;
  let 마디이름 = o.name, p = o;
  while (p.parent && p.parent !== gltf.scene) p = p.parent;   // 씬 바로 아래 = 노드
  마디이름 = p.name || o.name;
  const g = o.geometry.clone();
  g.applyMatrix4(o.matrixWorld);            // 노드 변환을 형상에 굽는다
  g.computeBoundingSphere();
  const m = Array.isArray(o.material) ? o.material[0] : o.material;
  재질전부.add(m);
  (부품[마디이름] || (부품[마디이름] = [])).push({ 형상: g, 재질: m });
});

const 크롬 = (부품['b1_lod0'] && 부품['b1_lod0'][0].재질) || [...재질전부][0];
const 발광재질 = [];
for (const m of 재질전부) {
  if (m.transparent || (m.map && (m.name || '').startsWith('dragonfly'))) {
    m.transparent = false;                  // 수천 개를 정렬할 수 없다
    m.alphaTest = 0.5;                      // 대신 잘라낸다
    m.side = THREE.DoubleSide;
  }
  if (m.emissive && (m.emissive.r + m.emissive.g + m.emissive.b) > 0) {
    발광재질.push(m);
    // 인스턴스마다 다른 색으로 빛나게 한다.
    // three 는 instanceColor 를 **정점 셰이더에서만** vColor 에 넣고, 프래그먼트 쪽에는
    // USE_COLOR 일 때만 varying 을 선언한다. 그 한 줄을 끼워 넣어 발광에 곱한다.
    // "자체로 밝다" = 확산·반사를 거의 0 으로. 화면에 보이는 것이 발광뿐이라 색이 안 섞인다.
    // 다만 완전한 검정은 몸이 없어 보이므로 아주 옅은 **미색**을 남긴다
    m.color.setRGB(1, .96, .90);
    m.emissive.setRGB(1, 1, 1);            // 색은 전부 인스턴스가 정한다
    m.metalness = 0; m.roughness = 1;
    m.onBeforeCompile = sh => {
      // three 는 USE_INSTANCING_COLOR 를 **정점 앞머리에만** 정의한다. 프래그먼트에서
      // 그 매크로로 감싸면 늘 거짓이라 주입이 통째로 빠진다. 그렇다고 vColor 를 직접
      // 선언하면 USE_COLOR 가 켜져 있을 때 중복 선언이 되어 컴파일이 깨진다.
      // 그래서 **이름이 겹치지 않는 내 varying** 을 만들어 직접 나른다.
      sh.vertexShader = sh.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vLED;')
        .replace('#include <begin_vertex>',
          '#include <begin_vertex>\n#ifdef USE_INSTANCING_COLOR\n vLED = instanceColor;\n#else\n vLED = vec3(1.0);\n#endif');
      sh.fragmentShader = sh.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vLED;')
        .replace('#include <emissivemap_fragment>',
          '#include <emissivemap_fragment>\ntotalEmissiveRadiance *= vLED;');
    };
    m.customProgramCacheKey = () => 'led-instance-emissive';
    m.envMapIntensity = 0;                  // 환경이 조금이라도 섞이면 색이 탁해진다
  }
  else m.envMapIntensity = 1.0;
}
function LED밝기적용() {
  for (const m of 발광재질) {

// ────────────────────────────────────────────────────────────────
// LED 색의 장 — 공간을 흐르는 색을 유닛이 제자리에서 읽는다
// ────────────────────────────────────────────────────────────────
// 팔레트는 코사인 식 하나로 만든다: c(t) = a + b·cos(2π(f·t + p)).
// 계수 넷만 바꾸면 완전히 다른 분위기가 나오고, 어떤 t 에서도 색이 끊기지 않는다.
// 색상(hue)만 훑고 채도는 높게 고정한다. 어느 값에서도 맑은 색이 나온다
const 팔레트정의 = {
  심해:   { 색상: [205, 232, 262, 288, 196], 채도: .92, 밝기: .56 },
  오로라: { 색상: [148, 168, 190, 262, 132], 채도: .88, 밝기: .58 },
  성운:   { 색상: [276, 302, 328, 352, 258], 채도: .86, 밝기: .58 },
  노을:   { 색상: [ 12,  32,  50, 340, 356], 채도: .90, 밝기: .58 },
  무지개: { 색상: [  0,  72, 144, 216, 288], 채도: .90, 밝기: .58 },
};
const 팔레트칸 = 256;
const 팔레트표 = {};
{
  const c = new THREE.Color();
  for (const 이름 in 팔레트정의) {
    const d = 팔레트정의[이름], 끝 = d.색상.length, arr = new Float32Array(팔레트칸 * 3);
    for (let i = 0; i < 팔레트칸; i++) {
      const p = i / 팔레트칸 * 끝;              // 색상 사이를 짧은 쪽으로 돈다
      const a = Math.floor(p) % 끝, b = (a + 1) % 끝, w = p - Math.floor(p);
      let h1 = d.색상[a], h2 = d.색상[b], dh = ((h2 - h1 + 540) % 360) - 180;
      const h = ((h1 + dh * w) % 360 + 360) % 360;
      c.setHSL(h / 360, d.채도, d.밝기, THREE.SRGBColorSpace);
      arr[i*3] = c.r; arr[i*3+1] = c.g; arr[i*3+2] = c.b;
    }
    팔레트표[이름] = arr;
  }
}

// ────────────────────────────────────────────────────────────────
// 유닛 종류

const 종류 = [];
for (const key in spec['유닛']) {
  const u = spec['유닛'][key];
  const 메시들 = u['메시'] || [];
  const lods = [];
  for (const n of 메시들) {
    const parts = 부품[n];                   // 노드 이름 그대로. 여러 재질이면 조각이 여럿
    if (parts && parts.length) lods.push(parts);
  }
  if (메시들.length && lods.length !== 메시들.length)
    console.warn('부품을 못 찾은 단계가 있다:', key, 메시들, Object.keys(부품));
  let 반지름 = 0;
  for (const p of (lods[0] || [])) 반지름 = Math.max(반지름, p.형상.boundingSphere.radius);
  반지름 = Math.max(반지름, u['공반지름_m'] || 0);
  종류.push({
    이름: key,
    공반지름: u['공반지름_m'],           // null이면 공이 메시 안에 있다
    실길이: u['실길이_m'],
    날개: u['날개'],
    lods,
    반지름,                              // 충돌·화면크기 판정용
    장신구: u['장신구'] === 'drop',
    잠자리: u['날개'] === '잠자리',
  });
}
const 종류수 = 종류.length;

// ────────────────────────────────────────────────────────────────
// 그리는 것들 — 전부 인스턴스
// ────────────────────────────────────────────────────────────────
const MAX = 3000;
const 인스턴스 = [];                       // [종류][단계] = [InstancedMesh, …]
for (const t of 종류) {
  const per = [];
  for (const parts of t.lods) {
    const ms = parts.map(p => {
      const im = new THREE.InstancedMesh(p.형상, p.재질, MAX);
      im.발광 = 발광재질.indexOf(p.재질) >= 0;   // LED 부품만 인스턴스 색을 쓴다
      // 색 버퍼를 **만들 때 미리** 붙인다. 나중에 처음 setColorAt 이 불릴 때 붙이면
      // 그 전에 컴파일된 프로그램에는 vColor 가 없어 색이 안 먹는다
      if (im.발광) im.instanceColor =
        new THREE.InstancedBufferAttribute(new Float32Array(MAX * 3).fill(1), 3).setUsage(THREE.DynamicDrawUsage);
      im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      im.frustumCulled = false;
      im.count = 0;
      scene.add(im);
      return im;
    });
    per.push(ms);

// 물방울 — 짧은 사인이 **위로** 굽는다. 아래로 굽히면 물이 아니라 뿅 소리가 된다

// 새 지저귐 — 주파수를 위아래로 훑는 짧은 곡선 두세 번

  const t = ac.currentTime, 마디수 = 2 + (Math.random()*2|0), 한마디 = .075;
  const o = ac.createOscillator(); o.type = 'sine';
  const g = ac.createGain(); g.gain.setValueAtTime(0, t);

    o.frequency.exponentialRampToValueAtTime(위, tt + 한마디 * .55);

// 음높이는 **월드 좌표가 아니라 배열 안에서의 비율**로 정한다.
// 모빌이 깔린 아래끝(y낮)에서 위끝(y높)까지를 0~1 로 보고 그 비율로 음을 고른다.
// 그래야 배치를 넓히든 좁히든, 카메라를 올리든 내리든 늘 아래는 낮고 위는 높다
function 높이를단계로(y) {

// 쿨다운이 **전역으로 하나**였다. 그래서 여럿이 한꺼번에 부딪히면 맨 처음 하나만 울리고
// 나머지는 통째로 버려졌다 — "소리나는 게 있고 안 나는 게 있다"는 게 이것이다.
// 유닛마다 따로 두면 저마다 제 소리를 낸다. 대신 한 순간에 쏟아지는 총량만 막는다.
// 손이나 마우스가 만진 유닛은 **그 소리가 잘 들려야 한다.** 저절로 부딪히는 소리에 묻히면

const 만진때 = new Float32Array(N최대);

// **만졌을 때 소리가 굶는다** — 빈도를 3으로 올렸더니 만짐이 10회 중 2회로 줄었다

// 뒷번호는 영영 조용해진다 — 150개로 모의해 보니 뒤쪽 35개가 3초 내내 한 번도 못 울었다.
// 그래서 상한을 나중에 걸지 않고 **확률을 먼저** 건다. 직전 창의 수요로 확률을 정하면
// 번호와 무관하게 같은 기회를 갖는다 (같은 모의에서 150개 중 149개가 울렸다).

  if (Math.random() >= Math.min(1, 창당상한 / Math.max(최근수요, 1))) { 소리셈.막힘++; return false; }
  부딪힘쓴수++;
  return true;
}

function 소리짤랑(i, y) {                           // 장신구 — 유리종
  if (!조절.소리 || !ac) return;
  const t = ac.currentTime;
  if (조절.부딪힘음량 <= 0) return;                 // 장신구는 저절로 나는 소리 쪽이다

  switch (지금음원().짤랑) {

    // 엉뚱한 소리가 된다 — **자연 음역 안에서** 배열 비율만큼만 오르내리게 한다

    case '여치':     벌레울림(3000 + 비*2200, .05 * 조절.부딪힘음량, 5, 105, 0, false); break;
    case '물방울':   물방울(700 + 비*1500, .05 * 조절.부딪힘음량); break;

function 소리부딪힘(i, v, y) {                       // 유닛끼리 — 피아노
  // 문턱이 0.5 m/s 여서 살살 닿는 것은 아예 소리가 없었다.
  // 낮추되 세기를 속도에 맞춰 — 살짝 스치면 아주 작게, 세게 치면 크게
  if (!조절.소리 || !ac || v < .12) return;
  const t = ac.currentTime;

  const 만짐 = (t - 만진때[i]) < .35;

  // 그 유닛은 제 쉬는 시간을 따로 세므로 닿는 족족 운다.

  const 층빈도 = 만짐 ? 조절.만짐빈도 : 조절.부딪힘빈도;

  switch (지금음원().타격) {
    // 귀뚜라미는 성글게 3~5번, 여치는 촘촘하게 오래 — 같은 합성기의 토막 빠르기만 다르다.
    // 주파수는 음계가 아니라 **그 벌레의 음역** 안에서 비율만큼 오르내린다
    case '귀뚜라미': 벌레울림(3300 + 비*1800, 세기 * 2.6, 3 + (Math.random()*3|0), 36, 0, true); break;
    case '여치':     벌레울림(2600 + 비*2000, 세기 * 2.4, 7 + (Math.random()*5|0), 115, 0, false); break;
    case '물방울':   물방울(520 + 비*1400, 세기 * 2.2); break;

// ────────────────────────────────────────────────────────────────
// 손 — 웹캠(미디어파이프)과 마우스가 같은 통로를 쓴다
// ────────────────────────────────────────────────────────────────
const 손 = [];                            // {pos, prev, vel, pinch, grabbed}
for (let i = 0; i < 3; i++) 손.push({
  pos: new THREE.Vector3(), prev: new THREE.Vector3(),
  초속: new THREE.Vector3(),              // 초당 속도 — 프레임률과 무관하게 만든다
  vel: new THREE.Vector3(),               // 이번 걸음의 변위
  live: false, pinch: false, grabbed: -1,
  뼈: new Float32Array(21 * 3), 뼈있음: false,
  // 인식은 초당 몇 번뿐이라 잰 값을 그대로 쓰면 뚝뚝 끊긴다.
  // 잰 것은 **목표**로 두고 실제 위치는 매 프레임 그리로 다가간다
  잰pos: new THREE.Vector3(), 잰집점: new THREE.Vector3(), 잰뼈: new Float32Array(21 * 3), 잰있음: false,
  이전겨냥: -1,                          // 겨냥이 바뀌면 '새로 만졌다'로 본다
  이어그리기: i > 0,                      // 웹캠 손만 사이를 이어 그린다. 마우스는 매 프레임 들어온다
  깊이: 0, 겨냥: -1,                       // 깊이는 겨냥한 유닛에서 빌려온다
  집점: new THREE.Vector3(),              // 엄지끝과 검지끝의 한가운데 — 여기로만 잡는다
  이전ndc: new THREE.Vector2(), 갱신시각: 0,
});

// 손 위치와 속도를 한 자리에서 정한다.
// 속도를 프레임 dt 로 나누면 안 된다 — 웹캠 손은 33 ms 마다만 갱신되므로
// 120 fps 에서는 [0, 4v, 0, 0, 0, 4v …] 로 튀어 치기문턱이 무력해진다.
// **위치가 실제로 갱신된 간격**으로 나눈다.
// 또 하나: 깊이는 겨냥한 유닛에서 빌려오므로 겨냥이 바뀌면 위치가 훌쩍 옮겨간다.
// 그것은 손이 움직인 것이 아니다. 그래서 이전 위치를 **지금 깊이에서 다시 계산**해
// 화면 위 움직임만 속도로 센다.
// 겨냥(과 깊이)은 **엄지·검지 사이**로 잰다. 잡히는 자리와 고리가 뜨는 자리가 같아야 한다.
// 휘젓는 힘은 **손바닥**이 낸다 — 손 전체로 헤치는 것이니 손바닥이 맞다.
// 그래서 점 두 개를 따로 받는다.
function 손위치갱신(H, 손바닥X, 손바닥Y, 집X, 집Y, 기본z, 즉시, now) {
  const z = 손깊이맞추기(H, 집X, 집Y, 기본z, 즉시);   // 겨냥은 집는 자리로
  const 반높이 = Math.tan(camera.fov * Math.PI / 360) * Math.max(camera.position.z - z, .1);
  const 반너비 = 반높이 * camera.aspect;
  const 높 = camera.position.y;
  if (!H.live) { H.이전ndc.set(손바닥X, 손바닥Y); H.갱신시각 = now - 16; }
  H.prev.set(H.이전ndc.x * 반너비, H.이전ndc.y * 반높이 + 높, z);
  H.잰pos.set(손바닥X * 반너비, 손바닥Y * 반높이 + 높, z);   // 후려치는 자리
  H.잰집점.set(집X * 반너비, 집Y * 반높이 + 높, z);          // 잡는 자리
  // 이어 그리지 않는 손(마우스)은 잰 값을 그대로 쓴다. 처음에만 넣으면 **그 자리에 얼어붙어**
  // 화면에서 누른 곳과 실제로 잡히는 곳이 어긋난다 — 클릭했는데 엉뚱한 게 잡히던 원인
  if (!H.이어그리기 || !H.잰있음) { H.pos.copy(H.잰pos); H.집점.copy(H.잰집점); }
  H.잰있음 = true;
  // 속도는 **잰 값끼리** 재야 한다. 이어 그린 위치로 재면 부드럽게 만든 만큼 힘이 죽는다
  const dt = Math.max((now - H.갱신시각) / 1000, 1e-3);
  H.초속.subVectors(H.잰pos, H.prev).divideScalar(dt);
  if (H.초속.length() > 12) H.초속.setLength(12);      // 순간이동 방지
  H.이전ndc.set(손바닥X, 손바닥Y);
  H.갱신시각 = now;
  H.live = true;

}
// 인식 사이를 이어 그린다. 초당 예닐곱 번뿐인 인식 결과를 그대로 쓰면 손이 뚝뚝 끊긴다.
// 잰 값으로 다가가되 잰 속도로 조금 앞질러 둬야, 부드러운 대신 뒤늦게 따라오는 일이 없다.
const _앞질러 = new THREE.Vector3(), _목표 = new THREE.Vector3();
function 손이어가기(dt, now) {
  const k = 1 - Math.exp(-dt / .05);
  for (let h = 1; h <= 2; h++) {                     // 웹캠 손만. 마우스는 매 프레임 들어온다
    const H = 손[h];
    if (!H.live || !H.잰있음) continue;
    const 지난 = Math.min((now - H.갱신시각) / 1000, .25);
    _앞질러.copy(H.초속).multiplyScalar(지난 * .55);   // 과하면 떨린다
    H.pos  .lerp(_목표.copy(H.잰pos ).add(_앞질러), k);
    H.집점.lerp(_목표.copy(H.잰집점).add(_앞질러), k);
    if (H.뼈있음) for (let n = 0; n < 63; n += 3) {
      H.뼈[n]   += (H.잰뼈[n]   + _앞질러.x - H.뼈[n])   * k;
      H.뼈[n+1] += (H.잰뼈[n+1] + _앞질러.y - H.뼈[n+1]) * k;
      H.뼈[n+2] += (H.잰뼈[n+2] + _앞질러.z - H.뼈[n+2]) * k;

}

// 소식이 끊기면 속도를 빠르게 재운다. 안 그러면 마지막 속도가 계속 힘을 준다
function 손속도재우기(now) {
  for (const H of 손) {
    if (!H.live) { H.초속.set(0, 0, 0); continue; }
    if (now - H.갱신시각 > 60) H.초속.multiplyScalar(.45);
  }

  실루엣.덮인줄 = 줄수;
  실루엣.있음 = 줄수 > 2;                      // 한두 줄은 잡음이다
  const now = performance.now();
  if (실루엣.있음) {
    const c = 무게 ? 합 / 무게 / W : .5;
    const 지난 = 실루엣.받은시각 ? Math.min(.4, (now - 실루엣.받은시각) / 1000) : 0;
    if (지난 > .004) 실루엣.속도 = 실루엣.속도 * .5 + ((c - 실루엣.중심) / 지난) * .5;
    실루엣.이전중심 = 실루엣.중심; 실루엣.중심 = c;
  } else { 실루엣.속도 *= .5; 몸안.fill(0); }
  실루엣.받은시각 = now; 실루엣.판++;
}

// 카메라가 사람을 어떻게 보고 있는지 겹쳐 본다. 벽 앞에서 카메라를 겨냥할 때 쓴다 —
// 이것 없이는 「사람이 왜 안 잡히나」를 눈으로 확인할 방법이 없다.
// 새 마스크가 왔을 때만 그린다
const 실루엣캔 = document.getElementById('silh');
const 실루엣ctx = 실루엣캔.getContext('2d');
let 실루엣그림 = null, 그린판 = -1;
function 실루엣그리기() {
  const 켬 = 조절.몸보이기 && 조절.몸모드 !== '손';
  실루엣캔.classList.toggle('hidden', !켬);
  if (!켬 || !실루엣.격자 || 실루엣.판 === 그린판) return;

  if (!실루엣그림) 실루엣그림 = 실루엣ctx.createImageData(W, H);
  const d = 실루엣그림.data, g = 실루엣.격자;

  실루엣캔.style.transform = 조절.몸좌우뒤집기 ? 'scaleX(-1)' : 'none';
}

// 발(門簾)을 젖히고 들어가듯 민다.
//
// 손과 다른 점이 둘이다.
//  ① **실 전체를 민다.** 손은 끝점(유닛)만 밀지만, 몸통은 실의 가운데를 덮는다.
//     마디 0 은 천장에 못 박혀 있으므로 가운데만 밀면 위는 붙고 가운데가 불룩 나가고
//     아래가 끌려온다 — 그게 발이 젖혀지는 모양이다. 끝점만 밀면 안 나온다
//  ② **먼저 빠져나갈 수 있는 쪽으로** 내보낸다. 가까운 쪽이 아니다 —
//     몸이 오른쪽으로 걸어오면 왼쪽 자락은 다가와서 금방 벗어나지만, 오른쪽 자락은
//     달아나므로 영영 못 벗어나고 앞날에 실려 화면 끝까지 끌려간다.
//     실제로 재보니 걸어가는 사람이 유닛 129개를 평균 1.9 m(최대 4.7 m) 밀고 갔다 —
//     발이 아니라 제설차였다. 몸이 서 있으면 이 식은 저절로 「가까운 쪽」이 되어
//     좌우로 갈라지고, 걸어가면 뒤로 흘려보내 등 뒤에서 닫힌다
function 몸적용(dt) {
  if (!실루엣.있음 || !실루엣.격자) return;
  const 모드 = 조절.몸모드;
  if (모드 === '손') return;
  const 가는쪽 = 모드 === '몸 · 가는 쪽으로';
  const g = 실루엣.격자, W = 실루엣.W, H = 실루엣.H, 왼 = 실루엣.왼, 오 = 실루엣.오;
  const tanH = Math.tan(camera.fov * Math.PI / 360), camZ = camera.position.z, asp = camera.aspect;
  const 좌우 = 조절.몸좌우뒤집기 ? -1 : 1;
  // 한 걸음에 빈틈의 이만큼 나간다. 한 번에 다 내보내면 순간이동이라 발이 아니라 유리다
  const 감 = Math.min(.9, 조절.몸세기 * dt * 7);
  const 여백 = 1.6;                                   // 가장자리보다 이만큼 더 바깥까지
  const 되돌림 = .75;                                  // 옛점을 덜 옮겨 남는 만큼이 속도가 된다
  // 「가는 쪽으로」는 몸이 움직이는 방향으로 쓸어 간다. 서 있으면 밀 방향이 없다
  const 쓸방향 = 가는쪽 ? (실루엣.속도 > .02 ? 1 : 실루엣.속도 < -.02 ? -1 : 0) : 0;
  if (가는쪽 && 쓸방향 === 0) return;
  // 몸이 가로로 얼마나 빨리 가나 (칸/초). 우리가 밀어낼 수 있는 속도와 견줘 탈출할 쪽을 고른다
  const 몸칸속 = 실루엣.속도 * W;
  const 밀칸속 = Math.max(2, 조절.몸세기 * W * .5);

  const 울림 = ac && 조절.소리 && 조절.만짐음량 > 0;
  const 몸속 = Math.min(3, Math.abs(실루엣.속도) * 3.2);

  for (let i = 0; i < N; i++) {
    if (잡힘[i] >= 0) continue;
    const base = i * (마디 + 1) * 3;
    let 끝안 = 0;
    for (let q = 1; q <= 마디; q++) {
      const o = base + q * 3;
      const d = camZ - 점[o+2];
      if (d < .12) continue;
      const inv = 1 / (tanH * d);
      const ndcX = 점[o] * inv / asp;
      const ndcY = (점[o+1] - camera.position.y) * inv;
      if (ndcX < -1.05 || ndcX > 1.05 || ndcY < -1.05 || ndcY > 1.05) continue;
      const nx = 좌우 < 0 ? (1 - ndcX) * .5 : (1 + ndcX) * .5;
      const gy = ((1 - ndcY) * .5 * H) | 0;
      if (gy < 0 || gy >= H) continue;
      const a = 왼[gy], b = 오[gy];
      if (a < 0) continue;
      const gx = (nx * W) | 0;
      if (gx < a || gx > b) continue;
      const 덮임 = g[gy * W + gx] / 255;
      if (덮임 < .35) continue;
      if (q === 마디) 끝안 = 1;

      // 어느 쪽으로 빠져나가는 게 **빠른가**. 왼쪽 자락은 몸이 오른쪽으로 오면 다가오고
      // (닫히는 속도 = 밀칸속 + 몸칸속), 오른쪽 자락은 달아난다 (밀칸속 − 몸칸속).
      // 몸이 서 있으면 둘 다 밀칸속이라 그냥 가까운 쪽이 이긴다 — 좌우로 갈라진다
      let 방향 = 쓸방향;
      if (!방향) {
        const 왼때 = (gx - a + 여백) / Math.max(.4, 밀칸속 + 몸칸속);
        const 오때 = (b - gx + 여백) / Math.max(.4, 밀칸속 - 몸칸속);
        방향 = 왼때 <= 오때 ? -1 : 1;
      }
      const 목표 = 방향 < 0 ? a - 여백 : b + 여백;
      const 밀칸 = (목표 - gx) * 감 * 덮임;
      // 칸 → 화면 → 미터. 좌우가 뒤집혔으면 미는 쪽도 같이 뒤집힌다
      const 밀m = 밀칸 * (좌우 < 0 ? -2 : 2) / W * asp * tanH * d;
      점[o]   += 밀m;
      옛점[o] += 밀m * 되돌림;                 // 남는 몫이 속도가 되어 지나간 뒤 되돌아 흔들린다
      번쩍[i] += 덮임 * dt * 3.5;
      if (q === 마디) 비틀림속[i] += 밀m * 6;
    }

    // 실루엣에 **들어오는 순간**에만 운다. 안에 머무는 내내 울면 서 있기만 해도 시끄럽다.
    // 사람이 가로질러 가면 유닛이 차례로 하나씩 울어 발을 스치는 소리가 된다
    if (끝안 && !몸안[i]) { if (울림) 잡는소리(i, Math.max(.5, 몸속)); }
    몸안[i] = 끝안;
  }
}

function 일꾼세우기(델리게이트) {
  if (일꾼상태 === '준비중' || 일꾼상태 === '됨') return;
  if (typeof Worker === 'undefined' || typeof createImageBitmap !== 'function') { 일꾼상태 = '못함'; return; }
  일꾼상태 = '준비중';
  try {
    일꾼 = new Worker('./libs/hand-worker.js');
  } catch { 일꾼상태 = '못함'; return; }
  일꾼.onerror = () => { 일꾼상태 = '못함'; 일꾼?.terminate(); 일꾼 = null; };
  일꾼.onmessage = e => {
    const m = e.data;
    if (m.종류 === '준비됨') { 일꾼상태 = '됨'; 진단.델리게이트 = m.델리게이트 + '·일꾼'; return; }
    if (m.종류 === '실패')  { 일꾼상태 = '못함'; 진단.오류 = '일꾼 실패 — ' + m.왜; 일꾼?.terminate(); 일꾼 = null; return; }
    if (m.종류 === '몸준비됨') { 실루엣.상태 = '됨'; return; }
    if (m.종류 === '몸실패')  { 실루엣.상태 = '못함'; 진단.오류 = '몸 인식 실패 — ' + m.왜; return; }
    if (m.종류 === '결과') {
      일꾼바쁨 = false;
      진단.인식ms = 진단.인식ms ? 진단.인식ms * .8 + m.걸림 * .2 : m.걸림;
      if (m.몸격자) 몸받기(m);
      else if (실루엣.상태 === '됨' && performance.now() - 실루엣.받은시각 > 700) { 실루엣.있음 = false; 몸안.fill(0); }
      if (m.오류) {
        진단.오류 = m.오류;
        손[1].live = 손[2].live = false; 손[1].뼈있음 = 손[2].뼈있음 = false;
        if (++진단.연속실패 === 3 && 진단.델리게이트.startsWith('GPU')) 델리게이트바꾸기('CPU', 'GPU 오류');
        return;
      }
      진단.연속실패 = 0;
      if (진단.오류 && !진단.오류.startsWith('카메라')) 진단.오류 = '';
      if (m.손봄) 손얹기(m.손들, performance.now());
    }
  };
  const 뿌리 = new URL('.', location.href).href;
  일꾼.postMessage({ 종류: '준비', wasm: 뿌리 + 'libs/mediapipe/wasm',
    모델: 뿌리 + 'libs/mediapipe/models/hand_landmarker.task',
    델리게이트, 손수: 손닿는기기 ? 1 : 2 });
}

// 몸은 **쓸 때 처음** 세운다. 손 모드로만 쓰는 사람은 244 KB 를 받을 일도 없다
function 몸세우기() {
  if (!일꾼 || 일꾼상태 !== '됨') return;
  if (실루엣.상태 === '준비중' || 실루엣.상태 === '됨') return;
  실루엣.상태 = '준비중';

  일꾼.postMessage({ 종류: '몸준비', wasm: 뿌리 + 'libs/mediapipe/wasm',
    모델: 뿌리 + 'libs/mediapipe/models/selfie_segmenter.tflite',

// 프레임을 넘긴다. 일꾼이 아직 앞 프레임을 붙들고 있으면 건너뛴다 — 밀리면 지연만 쌓인다
function 일꾼에보내기(now) {
  if (일꾼바쁨) {
    if (now - 일꾼보낸시각 > 4000) { 일꾼바쁨 = false; }   // 굳었으면 풀어준다
    return;
  }
  // 지금 모드에 필요한 것만 본다. 몸만 볼 때 손을 같이 돌리면 값 그대로 두 배가 든다
  const 쓸것 = 몸모드해석();
  if (쓸것.몸 && 실루엣.상태 === '안함') 몸세우기();
  if (!쓸것.손 && 실루엣.상태 !== '됨') return;          // 몸이 아직 안 섰으면 이번 프레임은 건너뛴다
  일꾼바쁨 = true; 일꾼보낸시각 = now; 진단.시도++;
  createImageBitmap(video).then(그림 => {
    if (!일꾼) { 그림.close(); 일꾼바쁨 = false; return; }
    일꾼.postMessage({ 종류: '프레임', 그림, 시각: now,
      손: 쓸것.손, 몸: 쓸것.몸 && 실루엣.상태 === '됨' }, [그림]);
  }).catch(() => { 일꾼바쁨 = false; });
}

async function 손인식만들기(델리게이트) {
  const { HandLandmarker, FilesetResolver } = await import('./libs/mediapipe/vision_bundle.mjs');
  const fs = await FilesetResolver.forVisionTasks('./libs/mediapipe/wasm');
  const 것 = await HandLandmarker.createFromOptions(fs, {
    baseOptions: { modelAssetPath: './libs/mediapipe/models/hand_landmarker.task', delegate: 델리게이트 },
    // 폰은 한 손만 본다. 두 손이면 인식 비용이 두 배인데 CPU 로 도느라 이미 벅차다.
    // 대가: 폰에서는 양손으로 동시에 만질 수 없다
    numHands: 손닿는기기 ? 1 : 2, runningMode: 'VIDEO',
  });
  진단.델리게이트 = 델리게이트;
  return 것;
}

// createFromOptions 는 delegate 값을 적어두기만 하고 GL 을 건드리지 않는다.
// **첫 프레임을 밀어 넣을 때** 비로소 webgl2 표면을 만든다 — 그래서 못 쓰는 GPU 는
// 만들 때가 아니라 detectForVideo 에서야 터진다. 그때 CPU 로 갈아탄다.
async function 델리게이트바꾸기(어느것, 까닭) {
  if (진단.갈아타는중 || 진단.델리게이트 === 어느것) return;
  진단.갈아타는중 = true;
  캠말보이기('손인식을 ' + 어느것 + ' 로 바꾸는 중… (' + 까닭 + ')');
  try {
    if (일꾼) { 일꾼.terminate(); 일꾼 = null; 일꾼상태 = '안함'; 일꾼바쁨 = false; }
    일꾼세우기(어느것);
    for (let i = 0; i < 60 && 일꾼상태 === '준비중'; i++) await new Promise(r => setTimeout(r, 100));
    if (일꾼상태 !== '됨') {
      const 옛 = 손인식;
      손인식 = await 손인식만들기(어느것);
      옛?.close?.();
    }
    진단.오류 = ''; 진단.연속실패 = 0; 진단.시도 = 0; 진단.잡힘 = 0;
    진단.켠시각 = performance.now();
  } catch (err) {
    진단.오류 = 어느것 + ' 도 실패 — ' + (err?.message || err?.name || err);
  }
  진단.갈아타는중 = false;
}

async function 웹캠켜기() {
  if (손켬) { 웹캠끄기(); return; }
  try {
    소리켜기();
    document.getElementById('btnCam').textContent = '웹캠 준비 중…';
    캠말보이기('카메라 여는 중…');
    const stream = await navigator.mediaDevices.getUserMedia({
      // 프레임률을 높게 청하면 브라우저가 노출을 짧게 잡아 **번짐이 줄어든다**.
      // 빠른 손이 안 잡히던 원인의 절반은 인식이 아니라 번진 영상이다
      video: { width: 640, height: 480, facingMode: 'user', frameRate: { ideal: 60, min: 24 } },
      audio: false });
    video.srcObject = stream; await video.play();
    // 폰은 화면이 꺼지거나 다른 앱으로 갔다 오면 트랙이 조용히 죽는다.
    // 죽은 줄 모르면 "카메라는 켜져 있는데 손만 안 잡힘"으로 보인다
    for (const t of stream.getVideoTracks()) {
      t.onended = () => { 진단.오류 = '카메라 트랙이 끊겼습니다 (다시 켜세요)'; };
      t.onmute  = () => { 진단.오류 = '카메라가 잠시 멈췄습니다'; };
      t.onunmute = () => { if (진단.오류.startsWith('카메라가 잠시')) 진단.오류 = ''; };
    }
    캠말보이기('손인식 준비 중… (17 MB)');
    const 어느것 = 조절.손인식CPU ? 'CPU' : 'GPU';
    일꾼세우기(어느것);
    // 일꾼이 서는 데 시간이 걸린다. 최대 6초만 기다리고 안 되면 화면 스레드 길로 간다
    for (let i = 0; i < 60 && 일꾼상태 === '준비중'; i++) await new Promise(r => setTimeout(r, 100));
    if (일꾼상태 !== '됨' && !손인식) 손인식 = await 손인식만들기(어느것);
    손켬 = true;
    진단.켠시각 = performance.now(); 진단.시도 = 0; 진단.잡힘 = 0; 진단.놓침 = 0; 진단.오류 = ''; 진단.연속실패 = 0;
    document.getElementById('btnCam').textContent = '웹캠 끄기';
    화면갱신();
  } catch (err) {
    console.error(err);
    // 손인식 만들기가 실패해도 이미 열린 스트림은 반드시 닫는다 — 안 그러면 누를 때마다 샌다
    if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
    손켬 = false;
    화면갱신();
    const 왜 = err?.name === 'NotAllowedError' ? '카메라를 허락하지 않았습니다'
             : err?.name === 'NotFoundError'   ? '카메라를 찾지 못했습니다'
             : (err?.message || err?.name || String(err));
    진단.오류 = 왜;
    캠말보이기('카메라 실패 — ' + 왜);
    document.getElementById('btnCam').textContent = '웹캠 실패 — ' + (err?.name || '오류') + ' (다시 누르기)';
  }
}
function 웹캠끄기() {

  if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  손[1].live = 손[2].live = false;

// 할 말이 있을 때만 뜨고, 손이 잡히면 저절로 사라진다

// 카메라는 켜졌는데 손이 한 번도 안 잡히면 작가가 원인을 볼 수 있어야 한다
function 캠말갱신(now) {
  if (!손켬) return;
  if (진단.오류) { 캠말보이기('카메라 — ' + 진단.오류); return; }
  if (진단.잡힘 > 0) { 캠말숨기기(); return; }
  if (진단.갈아타는중) return;

    + (진단.델리게이트 === 'GPU' ? ' — 설정 › 손보기 › 손인식CPU 를 켜보세요' : ''));

// 탭이 뒤로 가면 프레임이 멈춰 현(지속음)을 재울 사람이 없어진다. 소리를 통째로 재운다
document.addEventListener('visibilitychange', () => {

// 카메라가 (0,0,camZ)에서 −Z를 보고 있으므로, 어떤 깊이 z에서의 월드 좌표는
// 화면 비율만으로 정확히 나온다. z=0 평면에 광선을 쏘고 깊이만 따로 넣으면
// x·y가 그 깊이와 어긋난다 (전에 그렇게 되어 있었다)
function 정규화된손을월드로(nx, ny, z, out) {
  const 반높이 = Math.tan(camera.fov * Math.PI / 360) * Math.max(camera.position.z - z, .1);
  const 반너비 = 반높이 * camera.aspect;
  // 카메라가 오르내리면 화면 가운데가 그만큼 옮겨간다
  out.set((1 - nx * 2) * 반너비, (1 - ny * 2) * 반높이 + camera.position.y, z);
  return out;
}

const _hv = new THREE.Vector3();

// 미디어파이프는 결과 배열의 순서로 손의 정체성을 보장하지 않는다 — 추적이 끊겨
// 재검출되면 두 손이 자리를 서로 바꾸고, 물리는 순간이동으로 읽어 유령 타격이 난다.
// 이전 손바닥 자리와 가까운 쪽으로 배정해 정체성을 지킨다. 한 손만 잡혔을 때도
// 2번 자리에 가깝다면 2번으로 보낸다 — 1번에 억지로 넣으면 반대편 순간이동이 된다
const 손자리 = [null, null];               // 슬롯별 최근 손바닥(정규화), 0.7초 기억
function 손짝맞추기(손들, now) {
  const 팔 = k => ({ x: 손들[k][18], y: 손들[k][19] });        // 랜드마크 9번 = 손바닥
  const 기억 = 손자리.map(m => (m && now - m.때 < 700) ? m : null);
  const 멀기 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
  let 순서 = 손들;
  if (손들.length >= 2 && 기억[0] && 기억[1]) {
    if (멀기(팔(0), 기억[0]) + 멀기(팔(1), 기억[1]) >
        멀기(팔(0), 기억[1]) + 멀기(팔(1), 기억[0])) 순서 = [손들[1], 손들[0]];
  } else if (손들.length === 1 && 기억[1] &&
             (!기억[0] || 멀기(팔(0), 기억[1]) < 멀기(팔(0), 기억[0]))) {
    순서 = [undefined, 손들[0]];
  }
  for (let k = 0; k < 2; k++) {
    const lm = 순서[k];
    if (lm) 손자리[k] = { x: lm[18], y: lm[19], 때: now };
  }
  return 순서;
}

// 인식 결과(정규화 x,y 짝) 를 손에 얹는다. 화면 스레드에서 재든 일꾼이 재든 여기로 들어온다.
// 좌표는 Float32Array 로 [x0,y0, x1,y1, …] 21쌍이다
function 손얹기(손들, now) {
  if (손들.length) 진단.잡힘++;
  if (손들.length) 손들 = 손짝맞추기(손들, now);
  for (let k = 0; k < 2; k++) {
    const H = 손[1 + k], lm = 손들[k];
    if (!lm) {
      // 빠르게 휘두르면 영상이 번져 인식이 걸러 실패한다. 한 번 놓쳤다고 바로 지우면
      // 손이 없어졌다 나타났다 한다. 잠깐 붙잡아 뒀다가 계속 못 찾을 때만 놓는다
      if (H.live && now - H.갱신시각 < 300) { 진단.놓침++; continue; }
      H.live = false; H.뼈있음 = false;
      continue;
    }
    const X = n => lm[n*2], Y = n => lm[n*2+1];
    // 손 크기로 깊이를 어림한다 — 미디어파이프의 z는 손목 기준 상대값이라 절대 깊이가 아니다
    let minx=1,maxx=0,miny=1,maxy=0;
    for (let n = 0; n < 21; n++) {
      const x = X(n), y = Y(n);
      if (x<minx) minx=x; if (x>maxx) maxx=x; if (y<miny) miny=y; if (y>maxy) maxy=y;
    }
    const span = Math.max(maxx-minx, maxy-miny);
    const 어림z = THREE.MathUtils.clamp((span - .12) / .30, 0, 1) * 2.6 - .8;  // 크면 앞으로
    // 거울상이라 x를 뒤집는다. 손바닥(9)은 후려치는 자리, 엄지끝(4)·검지끝(8) 사이는 잡는 자리
    const 손바닥X = 1 - X(9) * 2, 손바닥Y = 1 - Y(9) * 2;
    const 집X = 1 - (X(4) + X(8)) * .5 * 2, 집Y = 1 - (Y(4) + Y(8)) * .5 * 2;
    const 처음 = !H.live;
    if (처음) H.깊이 = 어림z;
    const z = 손위치갱신(H, 손바닥X, 손바닥Y, 집X, 집Y, 어림z, 처음, now);
    for (let n = 0; n < 21; n++) {
      정규화된손을월드로(X(n), Y(n), z, _hv);
      H.잰뼈[n*3] = _hv.x; H.잰뼈[n*3+1] = _hv.y; H.잰뼈[n*3+2] = _hv.z;
      if (!H.뼈있음) { H.뼈[n*3] = _hv.x; H.뼈[n*3+1] = _hv.y; H.뼈[n*3+2] = _hv.z; }
    }
    H.뼈있음 = true;
    // 집기 — 엄지끝(4)과 검지끝(8)의 거리를 손 크기로 나눈다
    const dx = X(4) - X(8), dy = Y(4) - Y(8);
    H.pinch = Math.hypot(dx, dy) / Math.max(span, 1e-3) < .32;
  }
}

// 화면 스레드에서 직접 재는 길 — 일꾼이 안 될 때만 쓴다
const _평면손 = [];
function 손읽기바로(now) {
  if (now < 손다음) return;
  const 최소간격 = 손닿는기기 ? 66 : 33;
  손다음 = now + 최소간격;                 // 던져도 폭주하지 않게 먼저 잡아둔다
  let res;
  진단.시도++;
  const 잰시작 = performance.now();
  try {
    res = 손인식.detectForVideo(video, now);
    const 걸림 = performance.now() - 잰시작;
    진단.인식ms = 진단.인식ms ? 진단.인식ms * .8 + 걸림 * .2 : 걸림;
    // 화면 스레드를 막으므로 걸린 시간의 세 배로 띄운다. 여기서는 어쩔 수 없는 타협이다
    손다음 = now + Math.min(220, Math.max(최소간격, 진단.인식ms * 3));
    진단.연속실패 = 0;
    if (진단.오류 && !진단.오류.startsWith('카메라')) 진단.오류 = '';
  } catch (err) {
    진단.오류 = (err?.message || err?.name || String(err)).slice(0, 90);
    손[1].live = 손[2].live = false; 손[1].뼈있음 = 손[2].뼈있음 = false;
    if (++진단.연속실패 === 3 && 진단.델리게이트 === 'GPU') 델리게이트바꾸기('CPU', 'GPU 오류');
    return;
  }
  _평면손.length = 0;
  for (const lm of (res?.landmarks || [])) {
    const a = new Float32Array(lm.length * 2);
    for (let i = 0; i < lm.length; i++) { a[i*2] = lm[i].x; a[i*2+1] = lm[i].y; }
    _평면손.push(a);
  }
  손얹기(_평면손, now);
}

function 손읽기(now) {
  if (!손켬 || 진단.갈아타는중) return;
  // readyState 만 보면 부족하다 — 폰에서는 크기가 0×0 인 채로 2 까지 올라오는 일이 있고,
  // 그 프레임을 밀어 넣으면 미디어파이프가 조용히 빈 결과를 준다
  if (video.readyState < 2 || !video.videoWidth || !video.videoHeight || video.paused) return;
  if (일꾼상태 === '됨') { 일꾼에보내기(now); return; }
  if (손인식) 손읽기바로(now);
}

// ────────────────────────────────────────────────────────────────

// 기기 사정이지 작품의 모습이 아니다. 폰에서 저장한 것을 전시 기계에 불러왔을 때

function 저장소() {
  const S = window.ArtSettingsSync;
  if (S && S.__installed) return S;
  return {
    서버아님: true,
    get: k => { try { return localStorage.getItem(k); } catch { return null; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
    flush: () => Promise.resolve(false),
  };
}
function 프리셋읽기() {
  try { const o = JSON.parse(저장소().get(프리셋키) || '{}'); return (o && typeof o === 'object') ? o : {}; }
  catch { return {}; }
}

// 화면 좌표(정규화 −1..1)와 깊이로 유닛을 겨냥한다.
// 카메라가 (0,0,camZ)에서 −Z를 보므로 투영이 식 하나로 나온다 — 유닛 3000개도 가볍다.
// 반환: {z, i, 거리} 또는 null
function 겨냥(ndcX, ndcY, 여유) {
  const tanH = Math.tan(camera.fov * Math.PI / 360), camZ = camera.position.z;
  const asp = camera.aspect, end = 마디 * 3;
  // 두 갈래로 나눠 고른다.
  //  ① **정말로 그 위를 눌렀나** — 유닛의 원 안에 들면 그중 가장 앞엣것. 가림이 맞다
  //  ② 아무것도 못 눌렀을 때만 여유 안에서 **화면상 가장 가까운 것**
  // 예전에는 여유까지 한 덩어리로 보고 무조건 가장 앞엣것을 골랐다. 그래서 커서에서
  // 한참 떨어진 앞쪽 유닛이 잡혔다 — "클릭하면 다른 데가 클릭된다"가 이것이다
  let 안i = -1, 안z = 0, 안깊이 = Infinity;
  let 밖i = -1, 밖z = 0, 밖틈 = Infinity, 밖깊이 = 0;
  for (let i = 0; i < N; i++) {
    const o = i * (마디 + 1) * 3 + end;
    const d = camZ - 점[o+2];
    if (d < .12) continue;
    const inv = 1 / (tanH * d);
    const ux = (점[o] * inv / asp - ndcX) * asp;      // 세로 기준으로 맞춰 원형 판정
    const uy = (점[o+1] - camera.position.y) * inv - ndcY;
    const rr = 충돌반지름[i] * inv;
    const 거리2 = ux*ux + uy*uy;
    if (거리2 <= rr*rr) {
      if (d < 안깊이) { 안깊이 = d; 안z = 점[o+2]; 안i = i; }
    } else if (여유 > 0 && 안i < 0) {
      const 바깥 = rr + 여유;
      if (거리2 <= 바깥*바깥) {
        const 틈 = Math.sqrt(거리2) - rr;             // 원 밖으로 얼마나 벗어났나
        if (틈 < 밖틈) { 밖틈 = 틈; 밖z = 점[o+2]; 밖i = i; 밖깊이 = d; }
      }
    }
  }
  if (안i >= 0) return { z: 안z, i: 안i, 거리: 안깊이 };
  return 밖i < 0 ? null : { z: 밖z, i: 밖i, 거리: 밖깊이 };
}

// 위에서 내려다보는 평면도. 앞뒤로 어떻게 깔렸는지는 정면에서 안 보인다.
// 블렌더 넘패드 7 처럼 **완전히 고정된** 정사영 탑뷰다.
// lookAt 은 카메라가 대상 바로 위에 있을 때 위 방향과 시선이 나란해져 회전이 튈 수 있다.
// 회전값을 직접 박아 넣으면 그럴 여지가 없다 — X축 −90도면 아래를 보고 화면 위가 −Z(먼 쪽)다.
const 윗카메라 = new THREE.OrthographicCamera(-1, 1, 1, -1, .1, 400);
윗카메라.position.set(0, 120, 0);
윗카메라.rotation.set(-Math.PI / 2, 0, 0);
윗카메라.updateMatrixWorld(true);

// 카메라가 어디서 무엇을 보고 있는지 평면도에 같이 그린다 — 그래야 지도로 읽힌다
const 시야선 = new THREE.LineSegments(
  new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(new Float32Array(6 * 3), 3)),
  new THREE.LineBasicMaterial({ color: 0x6f7b8c, transparent: true, opacity: .8 }));
시야선.frustumCulled = false;
const 시야씬 = new THREE.Scene();
시야씬.add(시야선);
function 시야선갱신() {

  const 깊 = cz + 깊이범위() + 1;

  const 넣 = (x, z) => { a[n++] = x; a[n++] = 0; a[n++] = z; };
  넣(0, cz); 넣(-tan * 깊, cz - 깊);          // 왼쪽 시야선
  넣(0, cz); 넣( tan * 깊, cz - 깊);          // 오른쪽 시야선
  넣(-2.5, 0); 넣(2.5, 0);                    // 원점 가로선
  시야선.geometry.attributes.position.needsUpdate = true;
}

const _화면 = new THREE.Vector2(), _옛클리어 = new THREE.Color();
function 위에서그리기() {
  if (!조절['위에서 보기']) return;
  // setViewport 는 **CSS 픽셀**을 받는다. domElement.width(장치 픽셀)를 넘기면
  // 픽셀비만큼 이중으로 커져 화면 전체 매핑이 틀어진다
  renderer.getSize(_화면);
  const 폭 = _화면.x, 높 = _화면.y;
  const 칸 = Math.round(Math.min(폭, 높) * 조절['위뷰 크기']);
  const 여백 = Math.round(칸 * .07);
  // 유닛과 카메라가 **함께** 들어오게 틀을 잡는다 (가로는 X, 세로는 Z)
  const z먼쪽 = -깊이범위() - 1, z가까운쪽 = camera.position.z + .5;
  const z중심 = (z먼쪽 + z가까운쪽) * .5;
  const 반 = Math.max(배치범위.x * 1.1, (z가까운쪽 - z먼쪽) * .5) * 1.05;
  윗카메라.left = -반; 윗카메라.right = 반;
  윗카메라.top = 반; 윗카메라.bottom = -반;
  윗카메라.position.set(0, 120, z중심);
  윗카메라.updateProjectionMatrix(); 윗카메라.updateMatrixWorld(true);
  시야선갱신();

  const 옛자동 = renderer.autoClear;
  renderer.getClearColor(_옛클리어);
  const 옛알파 = renderer.getClearAlpha();
  renderer.autoClear = false;
  renderer.setScissorTest(true);
  renderer.setViewport(여백, 여백, 칸, 칸);
  renderer.setScissor(여백, 여백, 칸, 칸);
  renderer.setClearColor(0x05060a, 1);
  renderer.clear(true, true, false);
  renderer.render(scene, 윗카메라);
  renderer.clearDepth();
  renderer.render(시야씬, 윗카메라);
  // 테두리 — 얇은 띠를 네 변에 그려 창처럼 보이게 한다
  renderer.setClearColor(0x39404d, 1);
  const 선 = Math.max(1, Math.round(칸 * .006));
  for (const [x, y, w, h] of [[여백, 여백, 칸, 선], [여백, 여백 + 칸 - 선, 칸, 선],
                              [여백, 여백, 선, 칸], [여백 + 칸 - 선, 여백, 선, 칸]]) {
    renderer.setScissor(x, y, w, h); renderer.clear(true, false, false);
  }
  renderer.setScissorTest(false);
  renderer.setViewport(0, 0, 폭, 높);
  renderer.setClearColor(_옛클리어, 옛알파);   // 되돌리지 않으면 본 화면 배경이 바뀐다
  renderer.autoClear = 옛자동;
}

// 아웃포커싱 — **가장 가까운 유닛에 초점**을 맞춘다. 그래야 가까운 것이 또렷하고
// 뒤가 녹는다. z=0 평면에 초점을 두면 다가갈수록 앞뒤가 같이 흐려진다.
// 흐림이 없을 때는 통째로 꺼서 장면을 두 번 그리는 비용을 안 낸다
let 초점 = 9.5;
function 자동초점() {
  const tanH = Math.tan(camera.fov * Math.PI / 360), camZ = camera.position.z;
  const asp = camera.aspect, end = 마디 * 3;
  let 가장가까움 = Infinity;
  for (let i = 0; i < N; i++) {
    const o = i * (마디 + 1) * 3 + end;
    const d = camZ - 점[o+2];
    if (d < .12 || d >= 가장가까움) continue;
    const inv = 1 / (tanH * d);
    const nx = 점[o] * inv / asp, ny = (점[o+1] - camera.position.y) * inv;
    if (nx*nx*asp*asp + ny*ny > .36) continue;        // 화면 가운데쯤만 본다
    가장가까움 = d;
  }
  return isFinite(가장가까움) ? 가장가까움 : camera.position.z;
}
function 심도갱신(dt) {
  블룸합성.uniforms['amount'].value = 조절.블룸 ? 조절.블룸세기 : 0;
  bloom.radius = 조절.블룸번짐;
  bloom.threshold = 조절.블룸문턱;
  if (!조절.아웃포커싱) { bokeh.enabled = false; return; }
  const 목표 = 자동초점();
  초점 += (목표 - 초점) * Math.min(1, dt * 5);         // 초점이 갑자기 튀지 않게
  const 시작 = 조절.흐림시작;
  const t = THREE.MathUtils.clamp((시작 - 초점) / Math.max(시작 - .35, .1), 0, 1);
  bokeh.enabled = t > .02;
  if (!bokeh.enabled) return;
  bokeh.uniforms['focus'].value    = Math.max(초점, .2);
  bokeh.uniforms['aperture'].value = t * t * .0105 * 조절.흐림세기;
  bokeh.uniforms['maxblur'].value  = .004 + t * .018;
}

// 루프
// ────────────────────────────────────────────────────────────────
setBoot('첫 프레임…', 92);
let 마지막 = performance.now(), fps = 60, 통계다음 = 0;
// 순간 fps 만 보면 60 과 15 를 오갈 때 무엇이 참인지 알 수 없다.
// 최근 3초의 **최저**를 같이 들고 있어야 무거운 순간을 잡을 수 있다
let 최저fps = 60, 최저창 = 0;
const 걸음 = 1 / 60;              // 물리는 언제나 이 간격으로만 돈다
let 누적 = 0, 걸음수 = 0;

function 프레임(now) {
  requestAnimationFrame(프레임);
  try {
    const 실제dt = Math.min((now - 마지막) / 1000, 0.25);
    마지막 = now;
    const 즉시fps = 1000 / Math.max(now - (프레임.t || now - 16), 1);
    fps += (즉시fps - fps) * .06;
    if (즉시fps < 최저fps) 최저fps = 즉시fps;
    if (now > 최저창) { 최저창 = now + 3000; 최저fps = 즉시fps; }   // 3초마다 다시 잰다
    프레임.t = now;

    손읽기(now);
    손이어가기(실제dt, now);
    손속도재우기(now);

    // 고정 시간간격. 프레임률이 흔들려도 물리는 똑같이 돈다.
    // 밀린 시간이 너무 많으면 버린다 (안 그러면 따라잡느라 더 느려지는 악순환)
    누적 += 실제dt;
    if (누적 > 걸음 * 5) 누적 = 걸음 * 5;
    걸음수 = 0;
    while (누적 >= 걸음) {
      물리(걸음); 손적용(걸음); 몸적용(걸음); 충돌(걸음); 실헤치기(걸음); 속도제한(걸음);
      누적 -= 걸음; 걸음수++;
    }

    그리기();
    손뼈그리기();
    실루엣그리기();
    심도갱신(실제dt);
    블룸그리기();
    composer.render();

    if (뼈메시.visible || 관절.visible || 겨냥고리.visible) {
      renderer.autoClear = false;            // 손 UI 는 흐려지지 않게 맨 위에 따로 그린다
      renderer.render(겹침씬, camera);
      renderer.autoClear = true;
    }

    if (now > 통계다음) {
      통계다음 = now + 400;
      // 폭주하는지 눈이 아니라 숫자로 본다
      let sum = 0, 최대 = 0, 회전합 = 0; const end = 마디*3;
      for (let i = 0; i < N; i++) {
        const o = i*(마디+1)*3 + end;
        const s = Math.hypot(점[o]-옛점[o], 점[o+1]-옛점[o+1], 점[o+2]-옛점[o+2]) / 걸음;
        sum += s; if (s > 최대) 최대 = s;
        회전합 += Math.abs(비틀림속[i]);
      }
      const 평균속 = N ? sum / N : 0, 평균회전 = N ? 회전합 / N : 0;
      현갱신(평균속);
      fps칸.innerHTML = `${fps.toFixed(0)} fps`
        + `<small>최저 ${최저fps.toFixed(0)} · 유닛 ${N} · 소리 ${소리셈.운유닛.size}`
        + (손켬 ? ` · ${진단.델리게이트} ${진단.인식ms.toFixed(0)}ms · 놓침 ${진단.놓침}` : '')
        // 벽 앞에서 「사람이 잡히나」를 숫자로 봐야 한다. 안 잡히면 조명이 모자란 것이다
        + (조절.몸모드 !== '손'
            ? ` · 몸 ${실루엣.상태 === '됨' ? (실루엣.있음 ? '잡힘 ' + 실루엣.덮인줄 + '줄' : '없음') : 실루엣.상태}` : '')
        + `</small>`;
      stat.textContent = `걸음 ${걸음수}`
        + ` · 가까이 ${통계.lod[0]} 중간 ${통계.lod[1]} 멀리 ${통계.lod[2]}`
        + ` · 속도 평균 ${평균속.toFixed(2)} 최대 ${최대.toFixed(2)} m/s · 회전 ${평균회전.toFixed(2)} rad/s`
        + (손켬 ? ` · 손 ${손[1].live?1:0}${손[2].live?'+1':''}`
                 + ` (${진단.델리게이트} 시도 ${진단.시도} 잡힘 ${진단.잡힘})` : '')
        + ` · 소리 ${소리셈.운유닛.size}/${N}`;
      캠말갱신(now);
    }
  } catch (err) {                                    // 31번 교훈 8: 예외로 루프를 빠져나가면 화면이 검게 남는다
    console.error(err);
  }
}
requestAnimationFrame(프레임);

// 열자마자 웹캠을 켠다. 허락이 이미 있으면 조용히 켜지고, 처음이면 브라우저가 물어본다.

// 웹캠을 자동으로 켤 때 만들어진 오디오는 잠들어 있으므로 첫 손짓에 깨운다.

window.모빌 = { get N(){return N}, 점, 옛점, 앵커, 마디, 마디길이, 비틀림각, 비틀림속,
                소리셈, 높이를단계로, 배치범위,
                // 소리 시험용 창구 — 팔레트가 실제로 다른 소리를 내는지 재려면 필요하다
                소리켜기, 바탕세우기, 지금음원, 소리부딪힘, 소리짤랑, 만진때, 텅쿨,
                실루엣, 몸안, 몸적용, 몸받기, 몸세우기,   // 몸이 실을 젖히는지 재려면 필요하다
                // 물리를 손으로 한 걸음 돌린다. 창이 뒤에 있으면 rAF 가 멈춰 화면이 안 도는데,
                // 그때 「안 움직인다」를 고장으로 잘못 읽은 적이 두 번 있다. 눈이 아니라 이걸로 잰다
                한걸음: () => { 물리(걸음); 손적용(걸음); 몸적용(걸음); 충돌(걸음); 실헤치기(걸음); 속도제한(걸음); },
                get ac(){return ac}, get 마스터(){return 마스터},
                크기, 잡힘, 충돌반지름, 번쩍, 기준각, 종류색인, 종류, 조절, 걸음: () => 걸음, camera,
                손, bokeh, bloom, 겨냥, 자동초점, get 초점(){return 초점},
                scene, 인스턴스, 공메시, 발광재질, 팔레트표, LED색, 캔디색,
                소리상태: () => ({ 켜짐: !!ac, 상태: ac && ac.state, 울림수,
                                  현: !!현게인 && +현게인.gain.value.toFixed(4),
                                  근음: ac ? 지금근음() : null }) };
</script>
