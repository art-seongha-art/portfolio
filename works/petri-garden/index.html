<meta property="og:description" content="손짓으로 포자를 심고 온기로 발아시키는 실시간 배양접시. 세균 콜로니와 곰팡이가 생장 모델을 따라 서서히 피어난다.">

<!--
  ── 생장 규칙의 근거 ─────────────────────────────────────────────
  세균: 마츠시타(Matsushita)·후지카와의 고초균 콜로니 형태도를 따른다.
        한천 굳기 × 영양 농도에 따라 DLA형 가지 뻗기, Eden형 둥근 덩이,
        동심원 고리(이동-정착 반복), 매끈한 원판이 갈라진다.
        수식은 Kitsunezaki 계열 — 밀도 의존(비선형) 확산 ∇·(Db·b∇b)에
        Monod 포화 영양 소비를 결합한 반응-확산 두 마당(b, n).
        ∇·(b∇b) = ½∇²(b²) 로 이산화한다.
  곰팡이: Boswell 계열 균사 선단 신장·분지 모델을 GPU에서 감당할 수 있는
        반응-확산 근사로 옮겼다. 굳은(quenched) 잡음이 한천의 미세한
        불균질을 흉내 내 가장자리가 실제 균사 다발처럼 삐죽삐죽해진다.
        보송한 기중균사는 셸 텍스처링(fur) 열두어 겹으로 세운다.
        군집 중심부터 나이 들며 포자가 앉아 색이 짙어지고(가장자리는
        늘 하얀 어린 균사), 밤낮 리듬처럼 색 고리가 진다.
  상호작용: 페니실륨 둘레에는 세균이 못 붙는 저지선(항생 억제)이 생기고,
        군집끼리는 영양을 먼저 빨아들여 서로 자연스럽게 비켜 자란다.
  ────────────────────────────────────────────────────────────────
-->

<script type="module">
import * as THREE from 'three';
import { HDRLoader }       from 'three/addons/loaders/HDRLoader.js';
import { EffectComposer }  from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass }      from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass }      from 'three/addons/postprocessing/OutputPass.js';

const 손닿는기기 = matchMedia('(pointer:coarse)').matches || navigator.maxTouchPoints > 1;

// ────────────────────────────────────────────────────────────────
// 조절값
// ────────────────────────────────────────────────────────────────
const P = {
  배속: 1,
  한천부드러움: 0.26,   // 마츠시타 형태도의 가로축. 작으면 굳은 한천 → DLA 가지
  영양0: 0.85,          // 세로축. 리셋할 때 붓는다
  포자바람: 0.35,       // 저절로 날아드는 포자 빈도
  털길이: 1.0,
  블룸: true,
  화질: 손닿는기기 ? 0 : 1,
  손켬: true, 미리보기: false, 손CPU: 손닿는기기,
};

// 화질 단계 → 시뮬 해상도 · 융단 겹수 · 한천 격자
const 화질표 = [
  { 시뮬: 320, 겹: 7,  격자: 128, dpr: 1.5 },
  { 시뮬: 512, 겹: 12, 격자: 192, dpr: 2 },
  { 시뮬: 640, 겹: 16, 격자: 256, dpr: 2 },
];

// 접시 치수 (월드 단위)
const 한천반경 = 1.15, 유리반경 = 1.24, 유리높이 = 0.30, 한천두께 = 0.115;
const 맵반경 = 1.30;              // 시뮬 uv 정사각형이 덮는 반경
const 접시반경비 = 한천반경 / 맵반경;   // 셰이더의 접시 가장자리 (uv 좌표계)

// ────────────────────────────────────────────────────────────────
// 종 도감 — 시뮬 매개변수와 겉모습
//   diff 확산(퍼지는 힘) · grow 증식 · branch 굳은잡음(가지 뻗기) ·
//   ring 세균=이동-정착 고리 진동수 / 곰팡이=색 고리 · gloss 축축한 광 ·
//   fuzz 융단 높이 · height 두께 · wrink 주름
// ────────────────────────────────────────────────────────────────
const 종들 = [
  // 세균 (0–5) — 축축하고 반들반들, 융단 없음
  { 이름:'황색 포도상구균풍', 어림:'#e7b83c', 성숙:'#cf951f', diff:0.55, grow:1.05, branch:0.15, ring:0,   gloss:0.10, fuzz:0,     height:0.050, wrink:0.22 },
  { 이름:'세라티아풍(붉음)',  어림:'#d95b45', 성숙:'#a52c1e', diff:0.50, grow:1.00, branch:0.12, ring:0,   gloss:0.09, fuzz:0,     height:0.046, wrink:0.30 },
  { 이름:'프로테우스풍(고리)', 어림:'#e3d9c2', 성숙:'#c9bc9c', diff:1.65, grow:1.15, branch:0.10, ring:0.26,gloss:0.28, fuzz:0,     height:0.020, wrink:0.10 },
  { 이름:'슈도모나스풍',      어림:'#cbe063', 성숙:'#97b937', diff:0.80, grow:1.10, branch:0.22, ring:0,   gloss:0.13, fuzz:0,     height:0.032, wrink:0.18 },
  { 이름:'크로모박테리움풍',  어림:'#8a58a8', 성숙:'#38204e', diff:0.45, grow:0.90, branch:0.14, ring:0,   gloss:0.08, fuzz:0,     height:0.048, wrink:0.38 },
  { 이름:'고초균풍(가지)',    어림:'#efe9d6', 성숙:'#d6ccae', diff:0.15, grow:0.95, branch:0.88, ring:0,   gloss:0.45, fuzz:0,     height:0.026, wrink:0.26 },
  // 곰팡이 (6–11) — 가장자리는 어린 흰 균사, 중심부터 포자색으로 짙어진다
  { 이름:'푸른곰팡이',   어림:'#f2f4ee', 성숙:'#3f7a62', diff:0.80, grow:0.55, branch:0.50, ring:2.2, gloss:0.92, fuzz:0.052, height:0.030, wrink:0.30 },
  { 이름:'검은곰팡이',   어림:'#efe8d8', 성숙:'#221d19', diff:0.90, grow:0.60, branch:0.45, ring:0,   gloss:0.95, fuzz:0.078, height:0.036, wrink:0.34 },
  { 이름:'누룩곰팡이',   어림:'#f0eddc', 성숙:'#9d9339', diff:0.85, grow:0.58, branch:0.52, ring:1.4, gloss:0.9,  fuzz:0.060, height:0.030, wrink:0.28 },
  { 이름:'붉은빵곰팡이', 어림:'#f6e3d4', 성숙:'#d96a35', diff:1.30, grow:0.80, branch:0.60, ring:0,   gloss:0.88, fuzz:0.092, height:0.040, wrink:0.24 },
  { 이름:'털곰팡이',     어림:'#f4f2ee', 성숙:'#a39c93', diff:1.10, grow:0.70, branch:0.72, ring:0,   gloss:0.9,  fuzz:0.115, height:0.044, wrink:0.20 },
  { 이름:'청록곰팡이',   어림:'#eef3ea', 성숙:'#2f8f5b', diff:1.00, grow:0.75, branch:0.42, ring:2.8, gloss:0.9,  fuzz:0.050, height:0.028, wrink:0.26 },
];

const 배지들 = [
  { 이름:'물감 놀이',    색:'#e8e2ee', 거칠기:0.13, 무지개:1 },   // 레퍼런스처럼 물감 푼 한천
  { 이름:'LB 한천',      색:'#c99b5f', 거칠기:0.16 },
  { 이름:'혈액 한천',    색:'#9c2420', 거칠기:0.14 },
  { 이름:'사부로 한천',  색:'#decf9c', 거칠기:0.17 },
  { 이름:'EMB 한천',     색:'#4b3a52', 거칠기:0.13 },
  { 이름:'메틸렌블루',   색:'#3e6b85', 거칠기:0.15 },
];
let 배지 = 0;

// ────────────────────────────────────────────────────────────────
// 판 깔기
// ────────────────────────────────────────────────────────────────
const 붓 = (n, t) => { document.getElementById('bootBar').style.width = n + '%';
                       if (t) document.getElementById('bootMsg').textContent = t; };

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
if (!renderer.getContext().getParameter) throw new Error('WebGL 없음');
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#ececee');    // 흰 스튜디오
const camera = new THREE.PerspectiveCamera(42, 1, 0.05, 30);

// 궤도 — addons 에 컨트롤이 없어서 손수 만든다. 레퍼런스처럼 위에서 내려다본다
const 궤도 = { 방위: 0.55, 극: 0.30, 극목표: 0.30, 방위목표: 0.55, 거리: 3.55, 거리목표: 3.55 };
function 카메라놓기() {
  const r = 궤도.거리, 극 = 궤도.극, 방 = 궤도.방위;
  camera.position.set(r*Math.sin(극)*Math.sin(방), r*Math.cos(극), r*Math.sin(극)*Math.cos(방));
  camera.position.y += 한천두께;
  camera.lookAt(0, 한천두께 + 0.02, 0);
}

// 스튜디오 조명 — 큰 키라이트 + 반대편 필라이트 + 넉넉한 앰비언트
const 해 = new THREE.DirectionalLight('#fffdf7', 1.5);
해.position.set(1.6, 2.8, 1.1);
const 필 = new THREE.DirectionalLight('#eef2ff', 0.45);
필.position.set(-1.8, 1.6, -1.3);
scene.add(해, 필, new THREE.AmbientLight('#ffffff', 0.32));

// ────────────────────────────────────────────────────────────────
// GPGPU 시뮬 — MRT 핑퐁 (상태 + 혈통)
//   상태: R 세균 b · G 곰팡이 f · B 영양 n · A 나이(-1 = 휴면 포자)
//   혈통: R 종번호 (i+1)/16 · G 군집 난수 · B 예비 · A 굳은잡음 씨앗
// ────────────────────────────────────────────────────────────────
const 시뮬머리 = /* glsl */`
precision highp float;
float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float vno(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),f.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ return 0.55*vno(p)+0.3*vno(p*2.13)+0.15*vno(p*4.71); }
`;

const 시뮬정점 = /* glsl */`
in vec3 position; in vec2 uv; out vec2 vUv;
void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;

const 시뮬본체 = /* glsl */`
uniform sampler2D uS, uI;
uniform vec2  uPx;
uniform float uDt, uT, uAgar, uGerm, uDishR;
uniform vec4  uPts[4];   uniform int uPtN;    // xy 자리, z 온기(+)/냉기(-), w 반경
uniform vec4  uDrops[6]; uniform int uDropN;  // xy 자리, z 종번호, w 씨앗
uniform vec4  uSpec[12];                      // diff, grow, branch, ring
in vec2 vUv;
layout(location=0) out vec4 oS;
layout(location=1) out vec4 oI;

void main(){
  vec2 Pw = (vUv - 0.5) * 2.0;
  float mask = 1.0 - smoothstep(uDishR - 0.015, uDishR, length(Pw));
  vec4 s  = texture(uS, vUv);
  vec4 id = texture(uI, vUv);
  float b = s.r, f = s.g, n = s.b, age = s.a;

  // 이웃 아홉 칸 — 휴면 포자의 생물량은 퍼지지 않는다
  float lapB2 = 0.0, lapF = 0.0, lapN = 0.0;
  float bestM = 0.0; vec2 bestUV = vUv;
  for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
    if (i == 0 && j == 0) continue;
    vec2 u2 = vUv + vec2(float(i), float(j)) * uPx;
    vec4 ns = texture(uS, u2);
    float live = step(-0.5, ns.a);
    float nb = ns.r * live, nf = ns.g * live;
    float w = (i == 0 || j == 0) ? 0.2 : 0.05;
    lapB2 += w * nb * nb;  lapF += w * nf;  lapN += w * ns.b;
    float m = nb + nf;
    if (m > bestM) { bestM = m; bestUV = u2; }
  }
  float selfLive = step(-0.5, age);
  lapB2 -= (b*b*selfLive);  lapF -= f*selfLive;  lapN -= n;

  // 손의 입김
  float warm = 0.0, cold = 0.0;
  for (int k = 0; k < 4; k++) { if (k >= uPtN) break;
    float d = distance(vUv, uPts[k].xy);
    float g = exp(-d*d / (uPts[k].w * uPts[k].w));
    warm += max(uPts[k].z, 0.0) * g;  cold += max(-uPts[k].z, 0.0) * g; }

  int sp = int(id.r * 16.0 + 0.5) - 1;

  if (age < -0.5) {
    // 휴면 포자 — 온기가 닿거나 아주 드물게 저절로 깨어난다
    float ger = uGerm * uDt + warm * 0.01 * uDt;
    if (h21(vUv * 913.7 + fract(uT * 0.173)) < ger) age = 0.001;
    oS = vec4(b, f, n + uDt * 0.12 * lapN, age) * vec4(mask, mask, mask, 1.0);
    oI = id;
  } else {
    // 빈 칸이면 다가오는 이웃의 종 규칙을 미리 쓴다 (경계 전진)
    int spE = sp; vec4 idE = id;
    if (sp < 0 && bestM > 0.003) { idE = texture(uI, bestUV); spE = int(idE.r * 16.0 + 0.5) - 1; }
    vec4 sd = (spE >= 0) ? uSpec[spE] : vec4(0.0);
    bool mold = spE >= 6;

    float mono = n / (n + 0.38);
    float q  = fbm(vUv * 150.0 + idE.a * 41.3);
    float nm = mix(1.0, 0.25 + 1.7 * q, sd.z);          // 굳은잡음 → 가지
    float speed = (1.0 + 2.2 * warm) / (1.0 + 4.5 * cold);
    float grow = sd.y * mono * nm * speed;

    if (spE >= 0) {
      if (!mold) {
        float gate = 1.0;   // 프로테우스풍: 이동-정착을 되풀이해 고리가 남는다
        if (sd.w > 0.0) gate = smoothstep(-0.1, 0.3, sin(uT * sd.w + idE.g * 6.2831));
        b += uDt * (uAgar * sd.x * gate * 0.5 * lapB2 + grow * b * (1.0 - b));
        b -= uDt * b * (2.6 * f + 0.004 * (1.0 - mono));   // 항생 억제 + 굶주림
      } else {
        f += uDt * (0.055 * sd.x * lapF + grow * f * (1.0 - f));
        f -= uDt * f * (0.20 * b * step(b, 0.6) + 0.003 * (1.0 - mono));
      }
      n -= uDt * (0.18 * mono * b + 0.12 * (n / (n + 0.5)) * f);
      if (b + f > 0.06) age += uDt * 0.015 * (0.35 + 0.65 * mono) * speed;
    }
    n += uDt * 0.12 * lapN;

    // 갓 개척된 칸은 혈통을 물려받는다
    if ((s.r + s.g) < 0.012 && (b + f) >= 0.012 && sp < 0) { id = idE; age = max(age, 0.001); }
    if ((b + f) < 0.004) { id = vec4(0.0); age = min(age, 0.0); }

    oS = vec4(clamp(b,0.0,1.2), clamp(f,0.0,1.2), clamp(n,0.0,1.2), age) * vec4(mask,mask,mask,1.0);
    oI = id;
  }

  // 포자 떨어뜨리기 — 씨앗이 음수면 심자마자 깨어난다
  for (int k = 0; k < 6; k++) { if (k >= uDropN) break;
    float d = distance(vUv, uDrops[k].xy);
    if (d < 0.008) {
      float spN = uDrops[k].z;
      float seed = abs(uDrops[k].w);
      bool m2 = spN >= 5.5;
      float amt = 0.05 * (1.0 - d / 0.008);
      oS.r = m2 ? oS.r : max(oS.r, amt);
      oS.g = m2 ? max(oS.g, amt) : oS.g;
      oS.a = (uDrops[k].w < 0.0) ? 0.001 : -1.0;
      oI = vec4((spN + 1.0) / 16.0, h21(vec2(seed, 3.7)), 0.0, seed);
    } }
  if (mask <= 0.0) { oS = vec4(0.0); oI = vec4(0.0); }
}`;

const 초기본체 = /* glsl */`
uniform float uN0, uDishR;
in vec2 vUv;
layout(location=0) out vec4 oS;
layout(location=1) out vec4 oI;
void main(){
  vec2 Pw = (vUv - 0.5) * 2.0;
  float mask = 1.0 - smoothstep(uDishR - 0.015, uDishR, length(Pw));
  float n = uN0 * (0.92 + 0.16 * fbm(vUv * 9.0));   // 부을 때 생긴 얼룩
  oS = vec4(0.0, 0.0, n * mask, 0.0);
  oI = vec4(0.0);
}`;

const 종색어림 = 종들.map(z => new THREE.Color(z.어림));
const 종색성숙 = 종들.map(z => new THREE.Color(z.성숙));
const 종겉 = 종들.map(z => new THREE.Vector4(z.gloss, z.fuzz, z.height, z.wrink));
const 종고리 = 종들.map(z => z.ring);

const 겉머리 = /* glsl */`
uniform sampler2D tS, tI;
uniform vec3 uColY[12]; uniform vec3 uColM[12];
uniform vec4 uMat[12]; uniform float uRingC[12];
uniform vec3 uAgarCol; uniform float uAgarRough; uniform float uAgarSwirl;
float g_h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float g_vno(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(g_h21(i),g_h21(i+vec2(1,0)),f.x), mix(g_h21(i+vec2(0,1)),g_h21(i+vec2(1,1)),f.x), f.y); }
float g_fbm(vec2 p){ return 0.55*g_vno(p)+0.3*g_vno(p*2.13)+0.15*g_vno(p*4.71); }
int gSp(vec4 id){ return int(id.r*16.0+0.5)-1; }
float cH(vec2 uvp){
  vec4 s = texture2D(tS, uvp); vec4 id = texture2D(tI, uvp);
  int sp = gSp(id); if (sp < 0 || s.a < -0.5) return 0.0;
  vec4 mt = uMat[sp];
  float mat = clamp(s.a * 0.9, 0.0, 1.0);
  float hb = smoothstep(0.03, 0.85, s.r);
  float hf = smoothstep(0.03, 0.75, s.g);
  return mt.z * (sp < 6 ? hb * (0.7 + 0.3*mat) : hf * (0.5 + 0.5*mat) * 0.85);
}
float cHm(vec2 uvp){   // 잔주름까지 — 법선 뽑을 때만
  vec4 s = texture2D(tS, uvp); vec4 id = texture2D(tI, uvp);
  int sp = gSp(id); if (sp < 0 || s.a < -0.5) return 0.0;
  vec4 mt = uMat[sp];
  float mat = clamp(s.a * 0.9, 0.0, 1.0);
  float body = cH(uvp);
  float rid = abs(g_vno(uvp*95.0 + id.a*29.0)*2.0-1.0);   // 골 파인 주름
  float w = mt.w * mat * (1.0-rid) * 0.018 * smoothstep(0.06,0.4,s.r+s.g);
  return body + w;
}
`;

let 한천물;
function 한천만들기() {
  const 격자 = 화질표[P.화질].격자;
  const 기하 = new THREE.PlaneGeometry(맵반경*2, 맵반경*2, 격자, 격자);
  const 물 = new THREE.MeshPhysicalMaterial({
    color: '#ffffff', roughness: 0.16, clearcoat: 0.7, clearcoatRoughness: 0.25 });
  물.defines = { USE_UV: '' };
  물.onBeforeCompile = (sh) => {
    sh.uniforms.tS = { value: null }; sh.uniforms.tI = { value: null };
    sh.uniforms.uColY = { value: 종색어림 }; sh.uniforms.uColM = { value: 종색성숙 };
    sh.uniforms.uMat = { value: 종겉 }; sh.uniforms.uRingC = { value: 종고리 };
    sh.uniforms.uAgarCol = { value: new THREE.Color(배지들[배지].색) };
    sh.uniforms.uAgarRough = { value: 배지들[배지].거칠기 };
    sh.uniforms.uAgarSwirl = { value: 배지들[배지].무지개 ? 1 : 0 };
    물.userData.sh = sh;
    sh.vertexShader = 겉머리 + sh.vertexShader.replace('#include <begin_vertex>', /* glsl */`
      #include <begin_vertex>
      transformed.z += cH(uv);`);
    sh.fragmentShader = (겉머리 + sh.fragmentShader)
      .replace('#include <color_fragment>', /* glsl */`
      #include <color_fragment>
      {
        if (length((vUv - 0.5) * 2.0) > ${접시반경비.toFixed(4)}) discard;   // 접시 밖 모서리는 없다
        vec4 s = texture2D(tS, vUv); vec4 id = texture2D(tI, vUv);
        int sp = gSp(id);
        vec3 agarBase = uAgarCol;
        if (uAgarSwirl > 0.5) {
          // 물감을 풀어 넣은 한천 — 레퍼런스의 알록달록한 접시
          float t1 = g_fbm(vUv*2.7 + 3.1) + 0.35*g_fbm(vUv*7.3 + 11.0);
          float t2 = g_fbm(vUv*2.7 + 9.7);
          agarBase = 0.46 + 0.40*cos(6.2831*(t1*1.15 + vec3(0.08,0.40,0.71) + t2*0.35));
          agarBase *= 0.9;
        }
        // 영양을 빨린 자리는 뿌옇게 바랜다
        vec3 agar = mix(agarBase, agarBase*0.6 + vec3(0.32), (1.0 - s.b) * 0.35);
        vec3 col = agar;
        if (sp >= 0 && s.a > -0.5) {
          float mat = clamp(s.a*0.9, 0.0, 1.0);
          float mb = smoothstep(0.03, 0.6, s.r);
          float mf = smoothstep(0.03, 0.5, s.g);
          vec3 cy = uColY[sp], cm = uColM[sp];
          float band = 1.0;
          if (uRingC[sp] > 0.0) band = 0.86 + 0.14*sin(s.a*uRingC[sp]*22.0 + id.g*6.283);
          vec3 body = mix(cy, cm*band, mat);
          if (sp >= 6) body = mix(cy, cm*band, smoothstep(0.25, 0.95, mat)); // 곰팡이 테두리는 늘 하얗다
          float cover = max(mb, mf);
          // 가장자리 얇은 데는 한천이 비친다
          col = mix(agar, body, smoothstep(0.0, 0.55, cover));
          // 갓 자란 테두리는 살짝 밝게
          float rim = cover * (1.0 - cover) * 4.0;
          col += rim * 0.06;
        } else if (s.a < -0.5) {
          // 잠든 포자 — 작은 점
          col = mix(agar, vec3(0.55), smoothstep(0.005, 0.05, s.r + s.g) * 0.5);
        }
        diffuseColor.rgb = col;
      }`)
      .replace('#include <roughnessmap_fragment>', /* glsl */`
      #include <roughnessmap_fragment>
      {
        vec4 s = texture2D(tS, vUv); vec4 id = texture2D(tI, vUv);
        int sp = gSp(id);
        float r = uAgarRough;
        if (sp >= 0 && s.a > -0.5) {
          float cover = smoothstep(0.03, 0.5, max(s.r, s.g));
          r = mix(r, uMat[sp].x, cover);
        }
        roughnessFactor = r;
      }`)
      .replace('#include <normal_fragment_maps>', /* glsl */`
      {
        // 두께 마당에서 법선 일으키기 (범프)
        vec2 dx = dFdx(vUv), dy = dFdy(vUv);
        float H  = cHm(vUv);
        vec2 dH = vec2(cHm(vUv+dx)-H, cHm(vUv+dy)-H) * 140.0;
        vec3 sp_ = -vViewPosition;
        vec3 sx = normalize(dFdx(sp_)), sy = normalize(dFdy(sp_));

function 크기맞추기() {
  const dpr = Math.min(devicePixelRatio || 1, 화질표[P.화질].dpr);
  renderer.setPixelRatio(dpr);
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  composer?.setSize(innerWidth, innerHeight);
}
addEventListener('resize', 크기맞추기);

// ────────────────────────────────────────────────────────────────
// 시작
// ────────────────────────────────────────────────────────────────
붓(15, '유리 접시를 닦는 중…');
접시붓기();
접시세우기();
붓(40, '빛을 데우는 중…');

new HDRLoader().load('../wing-mobile/assets/hdri/studio_small_09_1k.hdr', (hdr) => {
  hdr.mapping = THREE.EquirectangularReflectionMapping;
  scene.environment = hdr;
  scene.environmentIntensity = 0.6;
  붓(85, '포자를 뿌리는 중…');
  마무리();
}, undefined, () => 마무리());   // HDR 이 없어도 굶지 않는다

let 시작됨 = false;
function 마무리() {
  if (시작됨) return; 시작됨 = true;
  크기맞추기(); 합성다시(); 동기화();
  시작파종();
  if (P.손켬) 캠켜기();
  붓(100);
  document.getElementById('boot').classList.add('gone');
  requestAnimationFrame(돌기);
}

// 콘솔에서 갖고 놀 수 있게 조금 열어 둔다
window.배양정원 = { P, 포자심기, 포자한줌, 접시붓기, 시작파종 };

// 저절로 날아드는 포자
let 다음바람 = performance.now() + 15000;

let 지난때 = performance.now();
function 돌기(때) {
  requestAnimationFrame(돌기);
  const dt초 = Math.min((때 - 지난때)/1000, 0.1); 지난때 = 때;

  // 궤도 감속
  궤도.방위 += (궤도.방위목표 - 궤도.방위) * 0.12;
  궤도.극   += (궤도.극목표 - 궤도.극) * 0.12;
  궤도.거리 += (궤도.거리목표 - 궤도.거리) * 0.1;
  카메라놓기();

  // 입김 모으기 — 손 먼저, 마우스가 거든다
  let 점들 = [];
  if (P.손켬 && 일꾼상태 === '됨') { 손프레임보내기(); 점들 = 손짓풀기(); }
  if (마우스.한천 && !마우스.끄는중) {
    점들.push(new THREE.Vector4(마우스.한천.u, 마우스.한천.v, 마우스.눌림 ? 1.0 : 0.3, 마우스.눌림 ? 0.12 : 0.06));
  }
  // 표지 그리기
  표지들.forEach((m, i) => {
    const pt = 점들[i];
    if (!pt || Math.abs(pt.z) < 0.05 || pt.w > 0.3) { m.material.opacity *= 0.8; return; }
    m.position.x = (pt.x*2-1) * 맵반경;
    m.position.z = -(pt.y*2-1) * 맵반경;
    m.material.color.set(pt.z > 0 ? '#ffb347' : '#7fb8e8');
    m.material.opacity = Math.min(0.65, m.material.opacity + 0.08);
    const s = 1 + 0.12*Math.sin(때*0.006 + i);
    m.scale.set(s, s, s);
  });

  // 바람에 실려 오는 포자
  if (때 > 다음바람) {
    다음바람 = 때 + (12000 + Math.random()*20000) / Math.max(P.포자바람, 0.05);
    if (P.포자바람 > 0.01) 포자한줌(1);
  }

  // 시뮬 — 배속만큼 걸음을 나눠 밟는다. 한 걸음 dt 0.05 로 늘 안정
  const 걸음 = Math.max(1, Math.round(P.배속));
  시뮬물.uniforms.uDt.value = 0.05 * P.배속 / 걸음;
  시뮬물.uniforms.uT.value = 시뮬시간;
  시뮬돌리기(걸음, 점들);
  배양분 += 걸음 * 4;
  window.__진단 = { 프레임: (window.__진단?.프레임 || 0) + 1, 배양분 };

  if (composer && P.블룸) composer.render();
  else renderer.render(scene, camera);
}
</script>
